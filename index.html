<style>
:root{--bg:#fcf8f3;--fg:#3a2a22;--card:#fff;--primary:#c99a2e;--pfg:#2e211a;--secondary:#f6e1e0;--muted:#f5efe8;--mfg:#7d6a60;--accent:#f8dcdb;--afg:#5c2e2b;--border:#eadbcf;--gold:#e0b227;--blush:#f5d3d2;--rose:#c9405a;--leaf:#3f6b4a;--r:10px;--shadow:0 18px 55px rgba(224,178,39,.2)}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
h1,h2,h3,.display{font-family:"Playfair Display",Georgia,serif;font-weight:600;margin:0;line-height:1.15}
p{margin:0}
:focus-visible{outline:3px solid rgba(201,154,46,.55);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.eyebrow{color:var(--rose);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.18em}
.muted{color:var(--mfg)}
.mesh{background:radial-gradient(circle at 15% 10%,rgba(224,178,39,.3),transparent 35%),radial-gradient(circle at 86% 22%,rgba(245,211,210,.75),transparent 38%),var(--bg)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.glow{border:1px solid var(--border);transition:border-color .25s,box-shadow .25s,transform .25s}
.glow:hover{border-color:var(--gold);box-shadow:0 15px 45px rgba(224,178,39,.23);transform:translateY(-3px)}
svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:700;font-size:.9rem;background:transparent;color:inherit;transition:filter .2s,background .2s,border-color .2s;white-space:nowrap}
.btn.luxe{background:linear-gradient(90deg,var(--primary),var(--rose));color:#fff;box-shadow:var(--shadow)}
.btn.luxe:hover{filter:brightness(1.06)}
.btn.outline{border-color:var(--border);background:var(--card)}
.btn.outline:hover{border-color:var(--gold);background:var(--accent)}
.btn.ghost:hover{background:var(--accent)}
.btn.lg{height:48px;padding:0 24px;font-size:1rem}
.btn.sm{height:34px;padding:0 12px;font-size:.82rem}
.btn.icon{width:40px;padding:0}
.btn.dark{background:var(--fg);color:#fff}
.btn:disabled{opacity:.6;cursor:not-allowed}
/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(252,248,243,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(234,219,207,.7)}
.hbar{display:flex;align-items:center;gap:24px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--pfg);display:grid;place-items:center}
.brand b{font-family:"Playfair Display",serif;font-size:1.3rem;font-weight:600;white-space:nowrap}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{padding:8px 12px;border-radius:7px;font-size:.88rem;font-weight:600;color:var(--mfg);transition:background .2s,color .2s}
nav.main a:hover,nav.main a.on{background:var(--accent);color:var(--afg)}
.hact{display:flex;gap:8px;align-items:center}
.cartdot{position:relative}
.cartdot i{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:#fff;font-size:.68rem;font-style:normal;display:grid;place-items:center;padding:0 4px}
@media(max-width:1020px){
 .hbar{flex-wrap:wrap;gap:10px}
 .hact{margin-left:auto}
 nav.main{order:3;width:100%;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(234,219,207,.6);padding-top:8px;margin-left:0}
 nav.main a{text-align:center;font-size:.72rem;padding:8px 4px}
 .hide-sm{display:none!important}
}
@media(max-width:430px){.xs-hide{display:none}.brand b{font-size:1.1rem}.hbar{flex-wrap:wrap}}
/* hero */

.slide.on{opacity:1;pointer-events:auto}
.slide img{width:100%;height:100%;object-fit:cover}
.slide .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(58,42,34,.78),rgba(58,42,34,.25) 55%,transparent)}
.slide .txt{position:absolute;left:0;right:0;bottom:96px}
.slide .txt>div{max-width:520px;color:#fff}
.slide h1{font-size:clamp(2.8rem,6vw,4.6rem);margin-top:12px}
.slide p.c{font-size:1.15rem;margin-top:14px}
.dots{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;align-items:center;gap:12px}
.dots .d{height:8px;width:8px;border-radius:4px;border:0;background:rgba(255,255,255,.7);transition:all .3s;padding:0}
.dots .d.on{width:36px;background:var(--primary)}
.dots .btn{background:rgba(255,255,255,.9);color:var(--fg)}

.quote{max-width:880px;margin:0 auto;text-align:center}
.quote .q{font-family:"Playfair Display",serif;font-size:clamp(1.5rem,3vw,2rem);line-height:1.5;margin-top:20px}

@media(max-width:760px){.crmband{grid-template-columns:1fr;padding:26px}}
/* page intro */
.intro{border-bottom:1px solid var(--border)}
.intro .wrap{padding-top:48px;padding-bottom:64px}
.intro h1{font-size:clamp(2.2rem,5vw,3.8rem);max-width:780px;margin-top:12px}
.intro p.c{max-width:640px;margin-top:16px}
/* table */
.tbl{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow)}
table{width:100%;min-width:650px;border-collapse:collapse;text-align:left}
thead{background:var(--rose);color:#fff}
th,td{padding:16px 20px}
th{font-size:.85rem}
tbody tr{border-top:1px solid var(--border);transition:background .2s}

tbody tr:hover{background:rgba(248,220,219,.7)}
.lnk{display:inline-flex;align-items:center;gap:4px;color:var(--rose);font-weight:700}
/* product */
.prod{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;margin-top:28px}

.thumbs img{width:100%;height:100%;object-fit:cover}
.sticky{position:sticky;top:130px;align-self:start}
@media(max-width:960px){.sticky{position:static}}
fieldset{border:0;padding:0;margin:24px 0 0}
legend{font-weight:800;font-size:.88rem;margin-bottom:8px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.pkg{overflow:hidden;display:flex;flex-direction:column}.pkg .art{aspect-ratio:5/3;border-bottom:1px solid var(--border);overflow:hidden}.pkg .art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.pkg:hover .art img{transform:scale(1.05)}
.treat{display:grid;grid-template-columns:180px 1fr;overflow:hidden;border-radius:var(--r);background:var(--card)}

@media(max-width:560px){.pkg{overflow:hidden;display:flex;flex-direction:column}.pkg .art{aspect-ratio:5/3;border-bottom:1px solid var(--border);overflow:hidden}.pkg .art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.pkg:hover .art img{transform:scale(1.05)}
.treat{grid-template-columns:1fr}}
/* cart */
.cart{display:grid;grid-template-columns:1fr .9fr;gap:32px;margin-top:32px}
@media(max-width:960px){.cart{grid-template-columns:1fr}}
.citem{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r);background:var(--card);margin-bottom:12px}

.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form{padding:24px;border-radius:var(--r);background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}
.form .f{display:grid;gap:14px;margin-top:20px}
.inp{height:44px;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:0 12px;font:inherit;color:inherit}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.ok{max-width:520px;margin:0 auto;padding:28px;text-align:center;border:1px solid var(--primary);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.qr{margin:20px auto 0;width:100%;max-width:280px;aspect-ratio:1;border-radius:var(--r);border:1px solid var(--border);object-fit:contain;background:#fff}
.bank{margin-top:20px;border-radius:8px;background:var(--muted);padding:16px;font-size:.9rem}
.note{font-size:.82rem;border-radius:8px;background:var(--accent);color:var(--afg);padding:10px 12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(40,28,22,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal[hidden]{display:none}
.modal .box{width:100%;max-width:460px;background:var(--card);border-radius:14px;padding:24px;display:grid;gap:16px}
/* footer */
footer{background:var(--fg);color:#fff;border-top:1px solid var(--border)}
footer .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;padding-top:48px;padding-bottom:48px}
footer a:hover{color:var(--primary)}
footer .ln{display:flex;gap:8px;align-items:center;font-size:.9rem;margin-bottom:8px}
@media(max-width:760px){footer .wrap{grid-template-columns:1fr}}
.totop{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;border-radius:50%}
.toast{position:fixed;bottom:24px;right:24px;background:var(--fg);color:#fff;padding:12px 16px;border-radius:10px;z-index:70;font-size:.9rem;max-width:320px}
.bk{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;margin-top:24px;align-items:start}
@media(max-width:1000px){.bk{grid-template-columns:1fr}}
.bk-main{display:grid;gap:18px;min-width:0}.bk-main>*{min-width:0}
.bk-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
.bk-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}.bk-h h2{font-size:1.35rem}.bk-h p{font-size:.84rem;margin-top:2px}
.bk-n{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--rose));color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.f2{display:grid;grid-template-columns:170px 1fr 1fr;gap:12px}.f2 label{font-size:.8rem;font-weight:700;display:grid;gap:6px}
@media(max-width:700px){.f2{grid-template-columns:1fr 1fr}.f2 label:nth-child(2){grid-column:span 1}}
@media(max-width:460px){.f2{grid-template-columns:1fr}}
.empty-note{padding:14px;border:1px dashed var(--border);border-radius:10px;font-size:.9rem;margin-bottom:12px}
.addrow{display:flex;gap:8px;margin-top:4px}.addrow .inp{flex:1}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}

.prod-r.on{border-color:var(--primary);background:#fdf6ea}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-weight:800}.qty button:disabled{opacity:.4;cursor:not-allowed}.qty span{min-width:18px;text-align:center;font-weight:800}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}

.day b{font-size:1.25rem;line-height:1.2}.day small{font-size:.7rem;color:var(--mfg)}
.day.on,.slot.on{background:linear-gradient(135deg,var(--primary),var(--rose));border-color:transparent;color:#fff}.day.on small{color:rgba(255,255,255,.85)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:14px}
.slot{height:38px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-weight:700;font-size:.88rem}
.slot:hover:not(:disabled),.day:hover,.stf:hover:not(:disabled){border-color:var(--gold)}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.staffs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stf{display:grid;justify-items:center;gap:4px;padding:14px 8px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);text-align:center}

.stf.on{border-color:var(--rose);background:var(--accent)}
.stf:disabled{opacity:.45;cursor:not-allowed}
.bk-sum{position:sticky;top:130px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
@media(max-width:1000px){.bk-sum{position:static}}
.bk-sum h2{font-size:1.4rem;margin-bottom:8px}
.sgroup{border-top:1px solid var(--border);padding:12px 0}
.sl{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);margin-bottom:6px}
.sr{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;padding:3px 0}.sr span{color:var(--mfg)}.sr span small{display:block;font-size:.74rem}.sr b{text-align:right}
.bk-sum .total{font-size:1.15rem;padding-top:10px;margin-top:6px}

.done-h{display:flex;gap:16px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--border)}
.done-g{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;margin-top:8px}

.dt{font-family:Manrope;font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);margin:20px 0 8px}
table.kv{min-width:0;width:100%}table.kv th,table.kv td{padding:7px 0;border-bottom:1px dashed var(--border);font-size:.92rem;vertical-align:top}table.kv th{color:var(--mfg);font-weight:600;width:42%}
.done .tbl thead{background:var(--muted);color:var(--fg)}.done .tbl th,.done .tbl td{padding:10px 14px}

a.pkg{color:inherit}
@media print{header.top,footer,.totop,.noprint,.toast{display:none!important}.mesh{background:#fff!important}.done{box-shadow:none;border-color:#ccc}}

const QRGEN=(()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26],NB=[-1,1,1,1,2,2,4,4,4,5,5];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36}return r};
  const dcw=v=>Math.floor(raw(v)/8)-ECC[v]*NB[v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  const div=d=>{const r=Array(d-1).fill(0).concat([1]);let root=1;for(let i=0;i<d;i++){for(let j=0;j<r.length;j++){r[j]=mul(r[j],root);if(j+1<r.length)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rem=(data,dv)=>{const r=dv.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);dv.forEach((c,i)=>r[i]^=mul(c,f))}return r};
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));let v=1;
    for(;v<=10;v++)if(4+(v<10?8:16)+bytes.length*8<=dcw(v)*8)break;
    if(v>10)throw new Error('QR: nội dung quá dài');
    const bits=[],put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    const cap=dcw(v)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    const nb=NB[v],el=ECC[v],rc=Math.floor(raw(v)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),dv=div(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;const e=rem(d,dv);if(i<ns)d.push(0);blocks.push(d.concat(e))}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=ns)cw.push(b[i])});
    const n=v*4+17,M=[...Array(n)].map(()=>Array(n).fill(false)),F=[...Array(n)].map(()=>Array(n).fill(false));
    const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<n;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
    const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<n&&yy>=0&&yy<n)set(xx,yy,d!==2&&d!==4)}};
    finder(3,3);finder(n-4,3);finder(3,n-4);
    if(v>1){const na=Math.floor(v/7)+2,step=Math.ceil((v*4+4)/(na*2-2))*2,al=[6];for(let p=n-7;al.length<na;p-=step)al.splice(1,0,p);
      al.forEach((ax,i)=>al.forEach((ay,j)=>{if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(ax+dx,ay+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}))}
    const fmt=mask=>{const d=mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
      for(let i=0;i<8;i++)set(n-1-i,8,g(i));for(let i=8;i<15;i++)set(8,n-15+i,g(i));set(8,n-8,true)};
    fmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(v<<12)|r;for(let i=0;i<18;i++){const c=((b>>>i)&1)!==0,a=n-11+i%3,bb=Math.floor(i/3);set(a,bb,c);set(bb,a,c)}}
    let bi=0;for(let right=n-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){const x=right-j,y=((right+1)&2)===0?n-1-vert:vert;if(!F[y][x]&&bi<cw.length*8){M[y][x]=((cw[bi>>>3]>>>(7-(bi&7)))&1)!==0;bi++}}}
    const MF=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!F[y][x]&&MF[m](x,y))M[y][x]=!M[y][x]};
    const penalty=()=>{let p=0,dark=0;
      for(let y=0;y<n;y++){let run=1;for(let x=1;x<=n;x++){if(x<n&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let x=0;x<n;x++){let run=1;for(let y=1;y<=n;y++){if(y<n&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      const pat=[true,false,true,true,true,false,true];
      for(let y=0;y<n;y++)for(let x=0;x<=n-7;x++){if(pat.every((c,k)=>M[y][x+k]===c)){const L=[1,2,3,4].every(k=>x-k<0||!M[y][x-k]),R=[1,2,3,4].every(k=>x+6+k>=n||!M[y][x+6+k]);if(L||R)p+=40}}
      for(let x=0;x<n;x++)for(let y=0;y<=n-7;y++){if(pat.every((c,k)=>M[y+k][x]===c)){const U=[1,2,3,4].every(k=>y-k<0||!M[y-k][x]),D=[1,2,3,4].every(k=>y+6+k>=n||!M[y+6+k][x]);if(U||D)p+=40}}
      M.forEach(r=>r.forEach(c=>{if(c)dark++}));p+=Math.floor(Math.abs(dark*20-n*n*10)/(n*n))*10;return p};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){apply(m);fmt(m);const p=penalty();if(p<bp){bp=p;best=m}apply(m)}
    apply(best);fmt(best);return M;
  }
  function svg(text,px){const M=encode(text),n=M.length,q=4,s=n+q*2;let d='';M.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+q} ${y+q}h1v1h-1z`}));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" width="${px||160}" height="${px||160}" shape-rendering="crispEdges" role="img" aria-label="Mã QR"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
  return {encode,svg};
})();

function crc16(s){let c=0xFFFF;for(const ch of new TextEncoder().encode(s)){c^=ch<<8;for(let i=0;i<8;i++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function vietqr(bin,acc,amount,info){
  const cons=tlv('00','A000000727')+tlv('01',tlv('00',bin)+tlv('01',acc))+tlv('02','QRIBFTTA');
  const noAccent=String(info||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'D').replace(/[^A-Za-z0-9 -]/g,'').slice(0,25);
  let p=tlv('00','01')+tlv('01','12')+tlv('38',cons)+tlv('53','704')+(amount?tlv('54',String(Math.round(amount))):'')+tlv('58','VN')+(noAccent?tlv('62',tlv('08',noAccent)):'')+'6304';
  return p+crc16(p);
}

function crm(){
  const d=ls.get('vua-local-spa',null);const vals=o=>Object.entries(o||{}).map(([id,v])=>({...v,id}));
  const staff=d&&d.staff?vals(d.staff).filter(x=>x.active!==false).map(x=>({id:x.id,name:x.name,role:x.role||'',color:x.color||'#b0476a'})):[];
  const prods=d&&d.products?vals(d.products).filter(x=>x.active!==false&&(x.price||0)>0).map(x=>({id:x.id,name:x.name,price:x.price,unit:x.unit||'',stock:x.stock})):[];
  const svcDur={};if(d&&d.services)vals(d.services).forEach(x=>svcDur[x.id]=x.duration||60);
  const appts=d&&d.appointments?vals(d.appointments).filter(a=>a.staffId&&a.date&&a.time&&['booked','confirmed','arrived'].includes(a.status)).map(a=>({staffId:a.staffId,date:a.date,start:hm(a.time),dur:svcDur[a.serviceId]||60})):[];
  return {staff:staff.length?staff:DEF_STAFF,prods:prods.length?prods:DEF_PRODS,appts,live:!!(d&&d.staff)};
}
const hm=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return h*60+(m||0)};
const fmtT=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dmy=s=>s?s.split('-').reverse().join('/'):'';
const WDN=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];

  const svcT=items.reduce((a,b)=>a+b.price,0),prodT=prods.reduce((a,p)=>a+p.price*p.qty,0);
  const dur=Math.max(30,items.reduce((a,i)=>a+minsOf(i),0));
  return {items,prods,svcT,prodT,total:svcT+prodT,dur,C};

function busy(C,staffId,date,start,dur){return C.appts.some(a=>a.staffId===staffId&&a.date===date&&start<a.start+a.dur&&a.start<start+dur)}
function slotOk(C,date,t,dur){
  const now=new Date();if(date===ymd(now)&&t<=now.getHours()*60+now.getMinutes()+30)return false;
  if(t+dur>CLOSE)return false;
  if(BK.staff)return !busy(C,BK.staff,date,t,dur);
  return C.staff.some(s=>!busy(C,s.id,date,t,dur));
}

function render(){
  const h=((location.hash||'#/').slice(1)||'/').split('?')[0]||'/';const parts=h.split('/').filter(Boolean);const route='/'+(parts[0]||'');
  clearInterval(slideT);
  let html,title='Spa HOA MAI — Chạm vào vẻ đẹp an nhiên';
  switch(route){
    case '/':html=home();break;
    case '/pricing':html=pricing();title='Bảng giá dịch vụ — Spa HOA MAI';break;
    case '/packages':html=packages();title='Gói dịch vụ — Spa HOA MAI';break;

  }
  document.title=title;$('#view').innerHTML=html;

function go(i){slideI=(i+slides.length)%slides.length;document.querySelectorAll('.slide').forEach((el,n)=>el.classList.toggle('on',n===slideI));document.querySelectorAll('.dots .d').forEach((el,n)=>el.classList.toggle('on',n===slideI))}

  const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.go){clearInterval(slideT);go(slideI+Number(t.dataset.go));return}

  if(t.tagName==='A'&&t.getAttribute('href')==='#/cart'&&DONE&&/^#\/cart/.test(location.hash)){DONE=null;render();window.scrollTo({top:0});return}

  if(t.dataset.pkg){const p=PACKAGES.find(x=>x.code===t.dataset.pkg);if(p){const c=cart();c.push({code:p.code,slug:'',name:p.name,img:p.img||IMG.facial,price:p.price,min:p.min,selected:{duration:p.min+' phút',pack:p.sessions?`Gói ${p.sessions} buổi`:'Gói combo',oil:'Không chọn'}});setCart(c);toast('Đã thêm '+p.name+' vào lịch hẹn');location.hash='#/cart'}return}
  if(t.dataset.fsbuy!==undefined){fsBuy(t.dataset.fsbuy);return}
  if(t.dataset.day){BK.date=t.dataset.day;keep();return}
  if(t.dataset.slot){BK.time=t.dataset.slot;keep();return}
  if(t.dataset.staff!==undefined){BK.staff=t.dataset.staff;keep();return}
  if(t.dataset.copy){try{navigator.clipboard.writeText(t.dataset.copy);toast(t.dataset.what?'Đã chép '+t.dataset.what+': '+t.dataset.copy:t.closest('.fscode')?'Đã sao chép mã '+t.dataset.copy:'Đã chép nội dung xác nhận, dán vào Zalo để gửi spa.')}catch(err){}}
  const a=t.dataset.act;
  if(a==='buy')buyModal();
  else if(a==='close')$('#modal').hidden=true;
  else if(a==='add')addToCart();
  else if(a==='reset')DONE=null;
  else if(a==='book')submitBooking();
  else if(a==='pay-open'&&DONE){DONE.payOpen=true;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='pay-later'&&DONE){DONE.payOpen=false;const y=window.scrollY;render();window.scrollTo(0,y)}

  const hello={role:'assistant',content:`Dạ em chào anh/chị ạ 🌸 Em là Tư vấn trực tiếp của Spa HOA MAI. Anh/chị cần em tư vấn dịch vụ, giá hay đặt lịch cứ nhắn em nha!`};
  body.innerHTML=`<p class="cb-time">Hôm nay</p>`+[hello,...CB.msgs].map(m=>{if(m.role==='user')return `<div class="cb-m me">${esc(m.content)}</div>`;const r=cbActs(m.content);return `<div class="cb-m bot">${esc(r.text)}${r.acts.length?`<div class="cb-acts">${r.acts.join('')}</div>`:''}</div>`}).join('')+(typing?'<div class="cb-typing"><i></i><i></i><i></i></div>':'');
  body.scrollTop=body.scrollHeight;
  $('#cbQuick').innerHTML=CB.msgs.length>6?'':QUICK.map(q=>`<button type="button" data-cbq="${esc(q)}">${esc(q)}</button>`).join('');
}
function cbOpen(){CB.open=true;$('#cb').hidden=false;$('#cbFab').hidden=true;cbRender();setTimeout(()=>$('#cbText').focus(),60)}
function cbClose(){CB.open=false;$('#cb').hidden=true;$('#cbFab').hidden=false}
async function cbAsk(text){
  text=String(text||'').trim();if(!text||CB.busy)return;
  if(!CB.xung){const w=' '+text.toLowerCase()+' ';if(/\s(chị|c)\s/.test(w))CB.xung='chị';else if(/\s(anh|a)\s/.test(w))CB.xung='anh'}
  CB.msgs.push({role:'user',content:text});cbSave();CB.busy=true;cbRender(true);
  const digits=text.replace(/[\s.]/g,'').match(/0\d{8,10}/);
  if(digits&&!CB.leadSent)cbLead(digits[0]);
  const started=Date.now();let reply=null;
  if(CB.ai!==false){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),20000);
    const r=await fetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:CB.msgs.slice(-14)}),signal:ctl.signal});clearTimeout(tm);
    const j=await r.json().catch(()=>null);if(r.ok&&j&&j.reply){reply=j.reply;CB.ai=true}else if(r.status===503||r.status===404||r.status===405)CB.ai=false}catch(e){CB.ai=CB.ai||false}}
  if(!reply)reply=localReply(text);
  const wait=Math.min(2200,600+reply.length*12)-(Date.now()-started);if(wait>0)await new Promise(r=>setTimeout(r,wait));
  CB.msgs.push({role:'assistant',content:reply});CB.busy=false;cbSave();cbRender();
}
function cbLead(phone){
  const um=CB.msgs.filter(m=>m.role==='user').map(m=>m.content.trim()).filter(t=>!/^[\d\s.+()-]{9,}$/.test(t));
  const note=um.slice(-8).map((t,i)=>`${i+1}. ${t}`).join('\n').slice(0,1500);
  const topics=[...new Set(um.map(t=>{const s=svcByText(t);return s&&s.name}).filter(Boolean))].join(', ');
  const code='CHAT'+Date.now().toString(36).toUpperCase();
  const lead={id:'lead_'+code,kind:'lead',code,xung:CB.xung?CB.xung.charAt(0).toUpperCase()+CB.xung.slice(1):'',name:'Khách chat',phone:phone.replace(/\D/g,''),topic:topics,notes:(topics?'Quan tâm: '+topics+'. ':'')+'Nội dung chat: '+um.slice(-8).join(' | '),items:[],products:[],total:0,createdAt:new Date().toISOString()};
  const inbox=ls.get(INBOX,[]);inbox.push(lead);ls.set(INBOX,inbox);
  fetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lead:{phone:lead.phone,name:lead.name,xung:lead.xung,topic:topics,note}})}).catch(()=>{});
  CB.leadSent=true;cbSave();
}

$('#cbFab').addEventListener('click',cbOpen);
$('#cbForm').addEventListener('submit',e=>{e.preventDefault();const i=$('#cbText');const v=i.value;i.value='';cbAsk(v)});
$('#cb').addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.cbq){cbAsk(t.dataset.cbq);return}
  if(t.dataset.act==='cb-close'){cbClose();return}
  if(t.dataset.act==='cb-lead'){const i=$('#cbText');i.value='';i.placeholder='Nhập số điện thoại của anh/chị…';i.focus();return}
  if(t.dataset.cbnav&&window.innerWidth<=520)cbClose();});

hydrateIcons();updCart();lastRoute=location.hash;render();
$('#fschip').addEventListener('click',openFlash);
loadFlash().then(()=>{if(FS&&/^#\/pricing/.test(location.hash))render();if(FS){const r='/'+(((location.hash||'#/').slice(1)||'/').split('?')[0].split('/').filter(Boolean)[0]||'');maybeFlash(r)}});
})();
</script>
