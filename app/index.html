  const val=id=>(f(id).value||'').trim(),num=id=>numIn(f(id).value);
  f('set-info').addEventListener('submit',async e=>{e.preventDefault();await put('settings','main',{...settings(),name:val('si-name')||settings().name,owner:val('si-owner'),phone:val('si-phone').replace(/\D/g,''),address:val('si-addr')});toast('Đã lưu thông tin')});
  f('si-logo').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const d=await readImage(file,320);await put('settings','main',{...settings(),logo:d});toast('Đã cập nhật logo')}catch(x){toast('Không đọc được ảnh.')}});
  f('set-fin').addEventListener('submit',async e=>{e.preventDefault();await put('settings','main',{...settings(),taxPct:Math.min(100,num('sf-tax')),bank:val('sf-bank'),invoiceFooter:val('sf-foot')});S.cart.taxPct=String(Math.min(100,num('sf-tax')));toast('Đã lưu cài đặt tài chính')});
  f('st-hr').addEventListener('submit',async e=>{e.preventDefault();await put('settings','main',{...settings(),workDays:num('hr-wd')||26,latePenalty:num('hr-lp'),shiftStart:val('hr-ss')||'08:30'});toast('Đã lưu cài đặt nhân sự')});
  f('st-sh').addEventListener('submit',async e=>{e.preventDefault();const out=[];let bad=0;
    el.querySelectorAll('#st-sh .shrow').forEach(r=>{const g=k=>r.querySelector(`[data-k="${k}"]`).value.trim();const name=g('name');if(!name)return;const start=g('start')||'08:30',end=g('end')||'17:30';if(toMin(end)<=toMin(start)){bad++;return}
      const old=shiftById(r.dataset.id);out.push({id:r.dataset.id||uid().slice(-5),name,start,end,color:(old&&old.color)||[...PALETTE,'#8E4F9E','#2E7F8F'].find(c=>!out.some(x=>x.color===c)&&!shiftsList().some(x=>x.color===c&&x.id!==r.dataset.id))||PALETTE[out.length%PALETTE.length]})});
    if(bad)return toast('Giờ kết thúc phải sau giờ bắt đầu.');if(!out.length)return toast('Cần ít nhất một ca.');
    await put('settings','main',{...settings(),shifts:out});toast('Đã lưu '+out.length+' ca làm việc')});
  f('restore-f').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{let j;try{j=JSON.parse(fr.result)}catch(x){return toast('File không hợp lệ.')}
    const data=j.data||j;if(!data||typeof data!=='object'||!data.customers)return toast('File không phải bản sao lưu VUA APP.');
    confirmSheet('Khôi phục dữ liệu?',`Thay toàn bộ dữ liệu ${T().org} hiện tại bằng bản sao lưu ${esc(j.exportedAt||'')}.`,'Khôi phục',async()=>{await replaceAll(data);toast('Đã khôi phục dữ liệu')})};fr.readAsText(file)});
}
async function replaceAll(data){
  if(!data.users||!Object.keys(data.users).length){data={...data,users:{}};S.data.users.forEach((v,k)=>{const x={...v};delete x.id;data.users[k]=x})}
  for(const c of COLS){for(const id of Array.from(S.data[c].keys()))if(!(data[c]&&data[c][id]))await del(c,id);for(const [id,v] of Object.entries(data[c]||{}))await put(c,id,v)}
  applyTheme();render();
}
function backup(){const o={};COLS.forEach(c=>{o[c]={};S.data[c].forEach((v,k)=>{const x={...v};delete x.id;o[c][k]=x})});downloadFile(`vua-app_${mode}_${TODAY}.json`,JSON.stringify({app:'VUA APP',mode,exportedAt:TODAY,data:o},null,1),'application/json')}
async function reseed(){const el=document.getElementById('seed-data');let j=null;try{j=el?JSON.parse(el.textContent):await (await fetch('seed.json')).json()}catch(e){}if(!j)return toast('Không tìm thấy dữ liệu mẫu.');const data={};COLS.forEach(c=>data[c]=j[`ws/${mode}/${c}`]||{});await replaceAll(data);toast('Đã nạp lại dữ liệu mẫu')}

function reqDoc(sid,W){return get('shiftreq',`${sid}_${W}`)}
function reqDay(sid,d){const r=reqDoc(sid,weekStartOf(d));return (r&&r.days&&r.days[d])||null}
function staffPref(sid,W){const r=reqDoc(sid,W),s=get('staff',sid)||{};return {pref:r&&r.pref!=null?r.pref:(s.shiftPref||''),target:(r&&r.target)||s.targetHours||40,note:(r&&r.note)||'',has:!!r}}
function reqViolation(sid,d){const r=reqDay(sid,d);if(!r)return '';const sh=shiftOn(sid,d);if(!sh||sh.off)return '';if(r.off)return 'đã xin nghỉ ngày này';if((r.block||[]).includes(sh.id))return 'đã đăng ký không làm được '+String(sh.name).toLowerCase();return ''}
function reqSummary(sid,W){
  const days=[0,1,2,3,4,5,6].map(i=>addDays(W,i)),p=staffPref(sid,W),parts=[];
  const off=days.filter(d=>(reqDay(sid,d)||{}).off);if(off.length)parts.push(`<span class="tag debt">Nghỉ: ${off.map(d=>WD[parseYmd(d).getDay()]).join(', ')}</span>`);
  days.forEach(d=>{const r=reqDay(sid,d);if(r&&!r.off&&(r.block||[]).length)parts.push(`<span class="tag warn">${WD[parseYmd(d).getDay()]}: không ${r.block.map(id=>shiftShort(shiftById(id)||{name:id}).toLowerCase()).join(', ')}</span>`)});
  if(p.pref)parts.push(`<span class="tag course">Thích ${esc(String((shiftById(p.pref)||{name:p.pref}).name).toLowerCase())}</span>`);
  parts.push(`<span class="tag">Mục tiêu ${p.target} giờ</span>`);
  return parts.join(' ');
}

       ${shifts.map(sh=>`<button type="button" class="chip reqsh" data-d="${d}" data-sh="${esc(sh.id)}" ${r.off?'disabled':''} aria-pressed="${(r.block||[]).includes(sh.id)}"><i class="staff-dot" style="background:${esc(sh.color||'#999')}"></i>${esc(sh.name)}</button>`).join('')}</div></div>`}).join('')}</div>
     <div class="form-row"><div class="field"><label for="rq-pref">Nguyện vọng ca</label><select class="input" id="rq-pref"><option value="">Không ưu tiên</option>${shifts.map(sh=>`<option value="${esc(sh.id)}" ${R.pref===sh.id?'selected':''}>${esc(sh.name)} ${esc(sh.start)}–${esc(sh.end)}</option>`).join('')}</select></div>

function carryAdmin(){const c=AU.carry;AU.carry=null;const ss=sessGet()||{};
  let u=all('users').find(x=>x.username===c.username);
  if(u&&u.role!=='admin'){toast('Tài khoản '+c.username+' ở chế độ này không phải quản lý, hãy đăng nhập lại.');sessSet(null);return}

function resolveSession(){
  const ss=sessGet();if(!ss||!S.ready)return null;if(ss.exp&&ss.exp<Date.now()){sessSet(null);return null}
  let u=get('users',ss.uid);if((!u||u.username!==ss.username)&&ss.username)u=all('users').find(x=>x.username===ss.username&&x.role==='admin'&&ss.role==='admin');
  if(!u||u.active===false)return null;if(ss.mode!==mode){if(u.role!=='admin')return null;sessSet({...ss,mode,uid:u.id},!!ss.remember)}
  return u;
}
async function doLogin(username,pw,remember){
  if(Date.now()<AU.lockUntil)return 'Nhập sai quá nhiều lần. Thử lại sau '+Math.ceil((AU.lockUntil-Date.now())/1000)+' giây.';
  const u=all('users').find(x=>x.username===String(username||'').trim().toLowerCase());
  if(!u||u.hash!==pwHash(pw,u.salt)){AU.fails++;if(AU.fails>=5){AU.lockUntil=Date.now()+60000;AU.fails=0}return 'Sai tên đăng nhập hoặc mật khẩu.'}
  if(u.active===false)return 'Tài khoản này đang bị khóa. Liên hệ quản lý.';
  AU.fails=0;sessSet({uid:u.id,username:u.username,role:u.role,mode,remember:!!remember,exp:Date.now()+(remember?30:1)*864e5},remember);
  await patch('users',u.id,{lastLogin:TODAY+' '+nowHM()});AU.user=get('users',u.id);S.tab=firstTab();return '';
}

/* ---------- KẾT NỐI WEBSITE (trang chủ Spa HOA MAI) ----------
   Website ghi lịch đặt online vào localStorage 'vua-web-inbox' (cùng tên miền).
   Phần mềm đọc hộp thư này: mỗi lịch → 1 dòng Danh sách chờ (nguồn Website) + hồ sơ Khách hàng (trùng SĐT thì cập nhật). */
const WEB_INBOX='vua-web-inbox';
const WEB_HOME=(()=>{try{return /\/app\/?(index\.html)?$/.test(location.pathname)?'../':'./'}catch(e){return '../'}})();
let _webBusy=false;
function webInbox(){try{const a=JSON.parse(localStorage.getItem(WEB_INBOX)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
/* nhập 1 đơn đặt online vào Danh sách chờ + hồ sơ khách (dùng chung cho hộp thư trình duyệt và máy chủ) */
async function importOrder(o){
  if(get('waitlist',o.id))return false;
  const items=Array.isArray(o.items)?o.items:[];
  const svc=items.map(it=>activeServices().find(s=>norm(s.name)===norm(it.name))).find(Boolean);
  const itemsTxt=items.map(it=>`${it.name}${it.duration?' '+it.duration:''}${it.pack&&it.pack!=='Gói đơn buổi'?' · '+it.pack:''}${it.oil&&it.oil!=='Không chọn'?' · dầu '+it.oil:''} (${money(it.price||0)})`).join('; ');
  const prodTxt=(Array.isArray(o.products)?o.products:[]).map(p=>`${p.name} × ${p.qty} (${money((p.price||0)*(p.qty||1))})`).join('; ');
  const st=(o.staffId&&get('staff',o.staffId))||(o.staffName&&activeStaff().find(s=>norm(s.name)===norm(o.staffName)))||null;
  const note=o.kind==='lead'?`Khách chat "Tư vấn trực tiếp" để lại SĐT – cần gọi lại tư vấn. ${o.notes||''}`.trim():[`Đặt online ${o.code}: ${itemsTxt}`,prodTxt?'Mua kèm: '+prodTxt:'',o.duration?'Dự kiến '+o.duration+' phút':'',
    o.payClaim?`Tổng ${money(o.total||0)} · KHÁCH BÁO ĐÃ CHUYỂN KHOẢN ${money(o.payClaim.amount)} (ưu đãi thanh toán ngay −${o.payClaim.pct}%) – cần kiểm tra tài khoản`:`Tổng ${money(o.total||0)} · thanh toán tại spa`,
    o.email?'Email: '+o.email:'',o.address?'Đ/c: '+o.address:'',o.notes?'Ghi chú: '+o.notes:''].filter(Boolean).join(' · ');
  const rec={name:String(o.name||'').trim(),phone:String(o.phone||'').replace(/\D/g,''),serviceId:svc?svc.id:'',staffId:st?st.id:'',date:/^\d{4}-\d{2}-\d{2}$/.test(o.date||'')?o.date:TODAY,slot:o.kind==='lead'?'Gọi lại tư vấn':(o.time?('lúc '+o.time):''),status:'waiting',note,webCode:o.code||'',webTotal:o.total||0,payClaim:o.payClaim||null,source:'Website',createdAt:TODAY};
  if(!rec.name&&!rec.phone)return false;
  const cid=await syncWaitCustomer({...rec,id:o.id},{source:'Website',xung:o.xung?String(o.xung).toLowerCase():'',birthday:o.birthday||''});
  await put('waitlist',o.id,{...rec,customerId:cid});
  return true;
}
async function importWebInbox(){
  if(_webBusy)return;const inbox=webInbox();if(!inbox.length)return;_webBusy=true;
  const done=[];let n=0;
  try{
    for(const o of inbox){
      if(!o||!o.id){done.push(o&&o.id);continue}
      if(o.kind==='pay'){const w=get('waitlist',o.orderId);if(!w)continue;
        if(!w.payClaim&&!w.paid){const pc={amount:o.amount,pct:o.pct,at:o.at};await put('waitlist',w.id,{...w,payClaim:pc,note:(w.note||'')+` · KHÁCH BÁO ĐÃ CHUYỂN KHOẢN ${money(o.amount)} (ưu đãi thanh toán ngay −${o.pct}%) – cần kiểm tra tài khoản`});n++}
        done.push(o.id);continue}
      if(await importOrder(o))n++;
      done.push(o.id);
    }
  }catch(e){console.error(e)}
  finally{
    try{const left=webInbox().filter(o=>o&&!done.includes(o.id));localStorage.setItem(WEB_INBOX,JSON.stringify(left))}catch(e){}
    _webBusy=false;
  }
  if(n){toast(`Có ${n} cập nhật lịch đặt từ website → đã vào Danh sách chờ`);S.webNew=(S.webNew||0)+n}
}

/* ---------- ĐỒNG BỘ MÁY CHỦ (đơn online + thanh toán SePay) ----------
   Website trên Vercel lưu đơn vào /api/orders; SePay báo tiền về /api/sepay-webhook.
   Phần mềm hỏi máy chủ mỗi 30 giây bằng khóa CRM_SYNC_KEY (lưu riêng trên máy này). */
const SYNC={busy:false,timer:null,last:'',err:''};
const lsGet=(k,d='')=>{try{return localStorage.getItem(k)??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function syncUrl(){const u=lsGet('vua-sync-url');if(u)return u;try{return new URL(WEB_HOME+'api/orders',location.href).href}catch(e){return ''}}
async function recordPaid(o){
  const w=get('waitlist',o.id);if(!w||w.paid)return false;const p=o.pay||{};const amt=p.paidAmount||p.received||0;
  const ref=(p.txs||[]).map(t=>t.ref||t.id).filter(Boolean).join(', ');
  const paid={amount:amt,at:new Date(p.paidAt||Date.now()).toISOString(),ref,discount:p.discount||0,via:'SePay'};
  await put('waitlist',w.id,{...w,paid,payClaim:null,note:(w.note||'').replace(/ · thanh toán tại spa/,'')+` · ĐÃ THANH TOÁN TRƯỚC ${money(amt)} qua SePay${p.discount?` (đã giảm ${money(p.discount)})`:''}${ref?' – mã GD '+ref:''} – KHÔNG THU LẠI`});
  const cid=w.customerId||'';const saleId='web_'+o.code;
  if(!get('sales',saleId)){
    const items=[...(o.items||[]).map(i=>{const s=activeServices().find(x=>norm(x.name)===norm(i.name));return {type:'svc',refId:s?s.id:'',name:i.name+(i.pack&&i.pack!=='Gói đơn buổi'?' · '+i.pack:''),qty:1,price:i.price||0}}),
      ...(o.products||[]).map(pr=>{const x=all('products').find(y=>y.id===pr.id||norm(y.name)===norm(pr.name));return {type:'prod',refId:x?x.id:'',name:pr.name,qty:pr.qty||1,price:pr.price||0}})];
    const label=`Đặt online ${o.code} (SePay)`;
    await put('sales',saleId,{customerId:cid,date:TODAY,label,items,subtotal:o.total||amt,discPct:p.discount?Math.round(p.discount*100/(o.total||1)):0,discount:p.discount||0,promoCode:p.discount?'THANH-TOAN-TRUOC':'',taxPct:0,tax:0,tip:0,total:amt,paid:amt,method:'transfer',kind:'online',staffId:w.staffId||'',createdAt:Date.now(),note:'Thanh toán trước qua SePay'+(ref?' · '+ref:'')});
    await put('payments','pay_'+saleId,{customerId:cid,saleId,amount:amt,method:'transfer',date:TODAY,label,createdAt:Date.now()});
  }
  if(cid)await put('notes','webpaid_'+o.code,{customerId:cid,kind:'Nhắc việc',text:`Đã thanh toán trước ${money(amt)} qua SePay cho lịch ${o.time||''} ${o.date?dm(o.date):''} (đơn ${o.code}). Không thu lại khi khách đến.`,author:'SePay',date:TODAY,pinned:true});
  return true;
}
async function syncServer(manual){
  const key=lsGet('vua-crm-key');if(!key||mode!=='spa'||!S.ready||!S.seedOk){if(manual)toast(key?'Chỉ đồng bộ ở chế độ Spa.':'Nhập khóa kết nối CRM trước.');return}
  if(SYNC.busy)return;SYNC.busy=true;let nNew=0,nPaid=0;
  try{
    const since=Number(lsGet('vua-sync-since','0'))||0;
    const r=await fetch(syncUrl()+'?since='+since,{headers:{'X-CRM-Key':key},cache:'no-store'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    let maxU=since;
    for(const o of (j.orders||[])){
      if(await importOrder(o))nNew++;
      if(o.pay&&o.pay.status==='paid'&&await recordPaid(o))nPaid++;
      else if(o.pay&&o.pay.status==='partial'){const w=get('waitlist',o.id);if(w&&!(w.note||'').includes('THANH TOÁN THIẾU'))await put('waitlist',w.id,{...w,note:(w.note||'')+` · THANH TOÁN THIẾU: đã nhận ${money(o.pay.received)}/${money(o.payAmount)}`})}
      maxU=Math.max(maxU,o.updatedAt||0);
    }
    lsSet('vua-sync-since',String(maxU));SYNC.last=new Date().toLocaleTimeString('vi-VN');SYNC.err='';
    if(nNew||nPaid)toast([nNew?`${nNew} lịch đặt online mới`:'',nPaid?`${nPaid} đơn đã thanh toán qua SePay`:''].filter(Boolean).join(' · '));
    else if(manual)toast('Đã đồng bộ – không có đơn mới.');
  }catch(e){SYNC.err=e.message||'Lỗi kết nối';if(manual)toast('Không kết nối được máy chủ: '+SYNC.err)}
  finally{SYNC.busy=false;if(S.tab==='settings')scheduleRender()}
}

   <div class="field"><label>Ghi chú điều kiện</label><input class="input" name="note" value="${esc(f.note||'')}" maxlength="160"></div>
   <div class="btn-grid"><button class="btn" type="button" id="fs-reset">${S.fsDraft?'Bỏ thay đổi':'Mẫu mặc định'}</button><button class="btn primary" type="submit">Lưu flash sale</button></div>
   <div class="infobox"><b>Để khách trên mọi thiết bị thấy chương trình:</b> sau khi lưu, bấm <b>Xuất flashsale.json</b> rồi tải file lên thư mục gốc repo GitHub (cùng chỗ index.html). Máy đang mở phần mềm này thấy thay đổi ngay khi mở website.</div>
   <div class="btn-grid"><button class="btn" type="button" id="fs-export">${I('csv')}Xuất flashsale.json</button><a class="btn" href="${WEB_HOME}#/?flash=preview" target="_blank" rel="noopener">Xem trên website</a></div></form>
   <section class="panel" style="padding:18px"><h2 style="color:var(--accent);margin:0 0 12px">Xem trước</h2>${fsPreview(f)}</section></div>`;
}
function fsPreview(f){const items=(f.items||[]).filter(i=>i.name&&i.sale);
  return `<div class="fs-prev"><div class="fs-prev-img"><span>${esc(f.badge||'FLASH SALE')}</span></div><div style="padding:14px"><b style="font-size:18px">${esc(f.title||'')}</b><p class="muted" style="margin:4px 0 10px;font-size:13px">${esc(f.subtitle||'')}</p>
   ${items.map(i=>`<div class="fs-pi"><span>${esc(i.name)}</span><span><s class="muted">${money(i.price)}</s> <b style="color:var(--accent)">${money(i.sale)}</b></span></div>`).join('')||'<div class="empty">Chưa có dịch vụ nào.</div>'}
   <p class="muted" style="font-size:12.5px;margin:10px 0 0">${f.start?'Từ '+esc(f.start.replace('T',' ')):''} ${f.end?'đến '+esc(f.end.replace('T',' ')):''}${f.code?' · Mã '+esc(String(f.code).toUpperCase()):''}</p></div></div>`}
function fsRead(){const fm=$('#fs-f');const v=n=>fm.querySelector(`[name="${n}"]`);const cur=fsCur();
  const items=[...fm.querySelectorAll('.fs-row')].map(r=>{const name=r.querySelector('[name=fs-svc]').value;const s=activeServices().find(x=>x.name===name);return {name,price:s?s.price:0,sale:Number(String(r.querySelector('[name=fs-sale]').value).replace(/\D/g,''))||0,limit:Number(String(r.querySelector('[name=fs-limit]').value).replace(/\D/g,''))||0}});
  return {...cur,active:v('active').checked,badge:v('badge').value.trim(),title:v('title').value.trim(),subtitle:v('subtitle').value.trim(),start:v('start').value,end:v('end').value,code:v('code').value.trim().toUpperCase(),image:v('image').value,freq:v('freq').value,note:v('note').value.trim(),items}}
function bindFlash(){const fm=$('#fs-f');if(!fm)return;const keep=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
  fm.addEventListener('change',()=>{S.fsDraft=fsRead();keep()});
  fm.querySelector('#fs-add').addEventListener('click',()=>{const d=fsRead();d.items=[...d.items,{name:'',price:0,sale:0,limit:0}];S.fsDraft=d;keep()});
  fm.querySelectorAll('[data-fsdel]').forEach(b=>b.addEventListener('click',()=>{const d=fsRead();d.items.splice(Number(b.dataset.fsdel),1);S.fsDraft=d;keep()}));
  fm.querySelector('#fs-reset').addEventListener('click',()=>{if(S.fsDraft)S.fsDraft=null;else S.fsDraft=fsDefault();keep()});
  fm.querySelector('#fs-export').addEventListener('click',()=>{const f=get('settings','flash');if(!f){toast('Hãy lưu flash sale trước khi xuất.');return}const o={...f};delete o.id;downloadFile('flashsale.json',JSON.stringify(o,null,1),'application/json');toast('Đã xuất flashsale.json – tải file lên thư mục gốc repo để khách thấy.')});
  fm.addEventListener('submit',async e=>{e.preventDefault();const d=fsRead();
    if(!d.title){toast('Nhập tiêu đề flash sale.');return}if(!d.end){toast('Chọn thời gian kết thúc.');return}if(d.start&&d.end&&d.start>=d.end){toast('Thời gian kết thúc phải sau thời gian bắt đầu.');return}
    d.items=d.items.filter(i=>i.name);if(!d.items.length){toast('Thêm ít nhất một dịch vụ giảm giá.');return}
    const bad=d.items.find(i=>!i.sale||i.sale>=i.price);if(bad){toast(`Giá sale của "${bad.name}" phải lớn hơn 0 và thấp hơn giá gốc ${money(bad.price)}.`);return}
    await put('settings','flash',{...d,updatedAt:new Date().toISOString()});S.fsDraft=null;toast('Đã lưu flash sale'+(d.active?' – đang hiển thị trên website':''))});
}


/* ---------- sheet ---------- */
function openSheet(html,onMount){const el=$('#sheet');el.innerHTML=`<div class="sheet-back" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;el.hidden=false;if(onMount)onMount(el)}
function closeSheet(){const el=$('#sheet');el.hidden=true;el.innerHTML='';S.sheetView=null}

/* ---------- render core ---------- */
let rq=0;
function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render();if(S.sheetView)S.sheetView()})}
const VIEWS={dash:()=>viewDash(),today:()=>viewToday(),pos:()=>viewPOS(),customers:()=>viewCustomers(),appts:()=>viewApptList(),cal:()=>viewCal(),wait:()=>viewWait(),notes:()=>viewNotes(),
  svc:()=>viewSvc(),prod:()=>viewProd(),supp:()=>viewSupp(),staff:()=>viewStaff(),roster:()=>hrRoster(),att:()=>hrAttendance(),payroll:()=>hrPayroll(),
  inv:()=>viewInv(),exp:()=>viewExp(),report:()=>viewReport(),promo:()=>viewPromo(),settings:()=>viewSettings(),help:()=>viewHelp(),me:()=>viewMe()};
function render(){
  const ae=document.activeElement,aid=ae&&ae.id,sel=ae&&('selectionStart' in ae)?(()=>{try{return [ae.selectionStart,ae.selectionEnd]}catch(e){return null}})():null;
  const inView=ae&&$('#view').contains(ae);
  applyTheme();
  if(AU.carry){if(!S.ready||!S.seedOk){document.body.classList.add('locked');$('#view').innerHTML='';$('#auth').hidden=false;$('#auth').innerHTML='<div class="auth-card"><div class="empty">Đang chuyển chế độ…</div></div>';return}carryAdmin();}
  if(S.ready&&S.seedOk&&!all('users').some(u=>u.role==='admin'&&u.active!==false))ensureDefaultUsers();
  if(S.ready&&S.seedOk&&mode==='spa'){importWebInbox();if(AU.user&&lsGet('vua-crm-key'))startSync()}
  if(S.ready&&S.seedOk&&!settings().deptAcc)ensureDeptAccounts();
  if(AU.user){AU.user=get('users',AU.user.id)||null;if(AU.user&&AU.user.active===false){AU.user=null;sessSet(null)}}
  if(!AU.user&&S.ready)AU.user=resolveSession();
  if(!AU.user||AU.user.mustChange){document.body.classList.add('locked');$('#view').innerHTML='';renderAuth();return}
  document.body.classList.remove('locked');$('#auth').hidden=true;$('#auth').innerHTML='';
  if(!VIEWS[S.tab]||!can(S.tab))S.tab=firstTab();
  renderShell();
  let html='';
  if(S.dbOk===false&&!S.bannerHidden)html+=`<div class="banner" style="display:flex;gap:10px;align-items:center">Bản chạy độc lập: dữ liệu được lưu trên trình duyệt của máy này. Nhớ sao lưu trong Cài đặt.<button class="btn sm ghost" type="button" data-act="banner-x" style="margin-left:auto" aria-label="Ẩn">${I('x')}</button></div>`;
  if(!S.ready)html+=`<div class="empty">Đang tải dữ liệu…</div>`;
  else{try{html+=VIEWS[S.tab]()}catch(err){console.error(err);html+=`<div class="warnbox">Có lỗi khi hiển thị trang này: ${esc(err.message)}</div>`}}
  $('#view').innerHTML=html;
  if(S.ready&&S.tab==='pos')bindPOS();
  if(S.ready&&S.tab==='settings'){bindSettings();bindUsersCard();bindWebSync()}
  if(S.ready&&S.tab==='promo'&&S.promoV==='flash')bindFlash();
  if(inView&&aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
function go(tab){if(!can(tab)){toast('Bạn không có quyền mở mục này.');return}S.tab=tab;S.navOpen=false;S.bell=false;closeSheet();render();window.scrollTo(0,0)}

/* ---------- customer notes helpers ---------- */
function custNotes(cid){return all('notes').filter(n=>n.customerId===cid).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.date||'').localeCompare(a.date||''))}
function custNotesWarn(cid){const p=custNotes(cid).filter(n=>n.pinned);return p.length?`<div class="warnbox">📌 ${p.map(n=>esc(n.text)).join('<br>📌 ')}</div>`:''}
function custNotesPanel(cid){const ns=custNotes(cid);return `<section class="panel"><div class="panel-h"><h2>Ghi chú</h2><span class="count num">${ns.length}</span><button class="btn sm" type="button" data-act="note-add" data-cid="${cid}" style="margin-left:8px">+ Thêm</button></div><div class="list">${ns.length?ns.slice(0,6).map(n=>`<div class="row clickable" data-act="note-edit" data-id="${n.id}"><span class="time" style="min-width:52px">${dm(n.date)}</span><div class="row-main"><b style="font-weight:500;white-space:normal">${n.pinned?'📌 ':''}${esc(n.text)}</b><span>${esc(n.kind||'Chung')} · ${esc(n.author||'')}</span></div></div>`).join(''):'<div class="empty">Chưa có ghi chú.</div>'}</div></section>`}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  if(S.bell&&!e.target.closest('#bell')&&!e.target.closest('#bellpop')){S.bell=false;renderShell()}
  if(!e.target.closest('.gsearch')){const g=$('#gres');if(g&&!g.hidden)g.hidden=true}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,ds=b.dataset;
  if(a!=='zalo')e.preventDefault();
  if(b.disabled)return;
  try{
  if(!AU.user)return;
  if(a.startsWith('t-'))return tableAct(a,ds);
  switch(a){
    case 'tab':go(ds.tab);break;
    case 'nav-open':S.navOpen=true;renderShell();break;
    case 'nav-close':S.navOpen=false;renderShell();break;
    case 'bell':S.bell=!S.bell;renderShell();break;
    case 'banner-x':S.bannerHidden=true;render();break;
    case 'g-go':gGo(ds.t,ds.id);break;
    case 'mode':if(ds.mode===mode)break;if(!AU.user||AU.user.role!=='admin'){toast('Chỉ quản lý được đổi chế độ.');break}AU.carry={...AU.user};AU.user=null;mode=ds.mode;try{localStorage.setItem('vua-mode',mode)}catch(x){}closeSheet();S.apptStaff='all';S.calStaff='all';S.sel={};S.tq={};S.cart=newCart();subscribe();render();toast('Đã chuyển sang chế độ '+T().org);break;
    case 'settings':go('settings');break;
    case 'close':closeSheet();break;
    case 'zalo':{const m=ds.msg;if(m&&navigator.clipboard){navigator.clipboard.writeText(m).then(()=>toast('Đã chép tin nhắn mẫu, dán vào Zalo để gửi'),()=>toast('Mở Zalo… (không chép được tin nhắn)'))}break}
    case 'contact':await put('contacts',`${ds.cid}_${TODAY}_${ds.kind}`,{customerId:ds.cid,kind:ds.kind,date:TODAY});toast('Đã đánh dấu đã liên hệ');break;
    case 'status':await setStatus(ds.id,ds.s);break;
    case 'appt':apptSheet(ds.id);break;
    case 'edit-appt':apptForm({id:ds.id});break;
    case 'appt-date':S.apptDate=ds.d;render();break;
    case 'appt-shift':S.apptDate=addDays(S.apptDate,Number(ds.n));render();break;
    case 'appt-staff':S.apptStaff=ds.id;render();break;
    case 'new-appt':if(!(can('appts')||can('cal')||can('today'))){toast('Bạn không có quyền đặt lịch.');break}S.navOpen=false;apptForm({customerId:ds.cid||''});break;
    case 'logout':logout();toast('Đã đăng xuất');break;
    case 'chpw':changePwSheet();break;
    case 'me-req':if(AU.user&&AU.user.staffId){S.hr.week=addDays(weekStartOf(TODAY),7);reqForm(AU.user.staffId)}break;
    case 'cal-v':S.calV=ds.v;render();break;
    case 'cal-w':S.calW=Number(ds.n)?addDays(S.calW,Number(ds.n)):weekStartOf(TODAY);render();break;
    case 'cal-staff':S.calStaff=ds.id;render();break;
    case 'cal-new':if(e.target.closest('.ev'))break;apptForm({date:ds.d,time:ds.h,staffId:S.calStaff!=='all'?S.calStaff:''});break;
    case 'ap-r':S.apR=ds.v;render();break;
    case 'ap-s':S.apS=ds.v;render();break;
    case 'cust':custSheet(ds.id);break;
    case 'cust-f':S.custF=ds.f;render();break;
    case 'new-cust':custForm();break;
    case 'edit-cust':custForm(ds.id);break;
    case 'note-add':noteForm(null,{customerId:ds.cid});break;
    case 'note-edit':noteForm(ds.id);break;
    case 'note-f':S.noteF=ds.v;render();break;
    case 'today-tab':S.todayTab=ds.v;render();break;
    case 'wait-f':S.waitF=ds.v;render();break;
    /* POS */
    case 'cart-tab':S.cartTab=ds.v;S.posQ='';render();break;
    case 'cart-add':cartAdd(ds.t,ds.id);break;
    case 'cart-qty':{const it=S.cart.items[Number(ds.i)];if(it){if(it.type==='prod'&&Number(ds.n)>0){const p=get('products',it.refId);if(p&&it.qty>=(p.stock||0)){toast('Chỉ còn '+(p.stock||0)+' trong kho.');break}}it.qty=Math.max(1,it.qty+Number(ds.n));S.cart.paid='';render()}break}
    case 'cart-rm':S.cart.items.splice(Number(ds.i),1);S.cart.paid='';render();break;
    case 'cart-method':S.cart.method=ds.m;render();break;
    case 'cart-clear':S.cart=newCart();render();break;
    case 'cart-pay':b.disabled=true;await cartPay();break;
    case 'debt-pay':debtSheet(ds.id);break;
    case 'pos-debt':closeSheet();S.cart={...newCart(),customerId:ds.cid};S.cartTab='debt';go('pos');break;
    case 'pos-course':closeSheet();S.cart={...newCart(),customerId:ds.cid};S.cartTab='pkg';go('pos');break;
    case 'pos-appt':{const ap=get('appointments',ds.id);if(!ap)break;const sv=get('services',ap.serviceId)||{};closeSheet();S.cart={...newCart(),customerId:ap.customerId,staffId:ap.staffId,appointmentId:ap.id,items:[{type:'svc',refId:ap.serviceId,name:sv.name||'Dịch vụ',price:ap.value||sv.price||0,qty:1,apptId:ap.id}]};S.cartTab='svc';go('pos');break}

    case 'prod-f':S.prodF=ds.v;render();break;
    case 'supp-v':S.suppV=ds.v;render();break;
    case 'po-f':S.poF=ds.v;render();break;

    case 'camp-all':{const l=segCustomers(S.camp.seg),pr=get('promos',S.camp.promoId);if(!l.length)return toast('Nhóm này chưa có ai.');navigator.clipboard&&navigator.clipboard.writeText(l.map(c=>c.name+' ('+c.phone+'): '+fillTpl(S.camp.tpl,c,pr?pr.code:'')).join('\n\n')).then(()=>toast('Đã chép '+l.length+' tin nhắn'));break}

    case 'hr-date':S.hr.date=ds.d;go('att');break;
    case 'hr-shift':{const nd=addDays(S.hr.date,Number(ds.n));if(nd<=TODAY){S.hr.date=nd;render()}break}

    case 'att-in':{const D=S.hr.date,cur=attDay(ds.sid,D)||{},start=shiftStartOf(ds.sid,D),tm=D===TODAY?nowHM():start;const late=tm>start;await setAtt(ds.sid,D,{in:tm,s:cur.s&&cur.s!=='present'&&cur.s!=='late'?cur.s:(late?'late':'present')});toast('Vào ca '+tm+(late?' · đi muộn':''));break}

    case 'ros-fill':{const W=S.hr.week,B=S.hr.brush,ch=[];activeStaff().forEach(st=>{for(let i=0;i<7;i++){const d=addDays(W,i);if(!rosVal(st.id,d))ch.push({sid:st.id,date:d,val:B})}});if(!ch.length){toast('Tuần này đã xếp đủ ca.');break}await setRosMany(ch);toast('Đã điền '+ch.length+' ô trống');break}
    case 'ros-send':copyRoster();break;
    case 'ros-propose':if(!activeStaff().length){toast('Chưa có nhân viên.');break}proposeSheet(false);break;
    case 'req-edit':reqForm(ds.sid);break;

    case 'theme':await setThemePref({accent:ds.v});toast('Đã đổi giao diện');break;
    case 'theme-mode':await setThemePref({theme:ds.v});break;
    case 'logo-rm':await put('settings','main',{...settings(),logo:''});toast('Đã gỡ logo');break;

    case 'wipe':confirmSheet('Xóa toàn bộ dữ liệu?',`Mọi ${T().cust}, lịch hẹn, hóa đơn, kho… của ${T().org} sẽ bị xóa. Nên sao lưu trước. Không thể hoàn tác.`,'Xóa hết',async()=>{const keep={settings:{main:{...settings()}}};const d={};COLS.forEach(c=>d[c]=keep[c]||{});await replaceAll(d);toast('Đã xóa dữ liệu')});break;
  }}catch(err){console.error(err)}
});
document.addEventListener('dblclick',e=>{const r=e.target.closest('tr[data-act="t-row"]');if(!r)return;const T0=TABLES[r.dataset.k];if(!T0)return;const f=T0.c.open||T0.c.view||T0.c.edit;if(f){S.sel[r.dataset.k]=r.dataset.id;f(r.dataset.id)}});
document.addEventListener('input',e=>{
  const id=e.target.id||'';
  if(id.startsWith('tq-')){S.tq[id.slice(3)]=e.target.value;render();return}
  if(id==='gq'){S.gq=e.target.value;const g=$('#gres');g.innerHTML=gsearchResults(S.gq);g.hidden=!S.gq.trim();return}
  if(id==='camp-tpl'){S.camp.tpl=e.target.value;clearTimeout(S._ct);S._ct=setTimeout(render,500);return}
});
document.addEventListener('change',e=>{
  const id=e.target.id||'';
  if(id==='theme-sel'){setThemePref({accent:e.target.value});return}
  if(id==='camp-promo'){S.camp.promoId=e.target.value;const p=get('promos',e.target.value);if(p&&!S.camp.tpl.includes('{ma}'))S.camp.tpl+=' Mã ưu đãi: {ma}.';render();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&K.on){if(!$('#sheet').hidden)closeSheet();else if($('#k-lock')){$('#k-lock').remove()}else kioskExitAsk();return}
  if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(S.bell||S.navOpen){S.bell=false;S.navOpen=false;renderShell()}const g=$('#gres');if(g&&!g.hidden){g.hidden=true}}
  if(e.key==='Enter'&&e.target.id==='gq'){const f=$('#gres button');if(f)f.click()}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('tr[data-act="t-row"]'))e.target.click();
  if((e.key==='/'||(e.key==='k'&&(e.ctrlKey||e.metaKey)))&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){e.preventDefault();$('#gq').focus()}
});
applyTheme();render();connect();
})();

</script>
