<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>VUA APP – Quản lý spa & nha khoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@1,600&display=swap">
<style>
:root{
  --bg:#FBF6F8; --surface:#FFFFFF; --surface-2:#F6EEF2; --ink:#241B22; --muted:#6E6370; --line:#EEDFE6;
  --accent:#E0156B; --accent-2:#C2105C; --accent-ink:#FFFFFF; --accent-soft:#FCE7F0; --accent-tint:#FFF5F9;
  --side:#1B1D2E; --side-2:#26293D; --side-ink:#D9DBE8; --side-head:#F2C94C;
  --blush:#FBE3EC; --blush-ink:#9B2F5C;
  --ok:#23884F; --ok-soft:#E2F4E9; --warn:#A8690F; --warn-soft:#FBEFD9; --bad:#D23A36; --bad-soft:#FCE4E2;
  --info:#2D62C4; --info-soft:#E4ECFA;
  --b-green:#2E9E4F; --b-cyan:#12A5C9; --b-red:#E5483F; --b-purple:#8A2BC2; --b-blue:#2E7BE0;
  --shadow:0 10px 30px rgba(36,27,34,.12); --radius:14px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#4a3aa7;--s7:#008300;--s8:#e34948;
}
/* ---- 10 theme accents ---- */
:root[data-accent="emerald"]{--accent:#1E7A68;--accent-2:#155E50;--accent-soft:#DDF1EA;--accent-tint:#F3FAF7;--bg:#F6FAF8;--surface-2:#EDF4F1;--line:#DCE8E3;--side:#14211D;--side-2:#1E302A;--side-head:#9FE3C9;--blush:#E2F1EC;--blush-ink:#1E6B5B}
:root[data-accent="lavender"]{--accent:#7C4DDB;--accent-2:#5F33BD;--accent-soft:#EEE7FC;--accent-tint:#F8F5FE;--bg:#F8F6FC;--surface-2:#F0ECF8;--line:#E4DDF2;--side:#1E1A2E;--side-2:#2A2540;--side-head:#F2C94C;--blush:#EEE7FC;--blush-ink:#5F33BD}
:root[data-accent="ocean"]{--accent:#1D6FD6;--accent-2:#1553A6;--accent-soft:#E2EDFB;--accent-tint:#F4F8FE;--bg:#F5F8FC;--surface-2:#EBF1F8;--line:#DCE5F0;--side:#131C2E;--side-2:#1D2940;--side-head:#7FD3FF;--blush:#E2EDFB;--blush-ink:#1553A6}
:root[data-accent="coral"]{--accent:#E8573A;--accent-2:#C4401F;--accent-soft:#FDE8E2;--accent-tint:#FFF6F3;--bg:#FDF8F6;--surface-2:#F8EFEB;--line:#F0E0D9;--side:#2A1C1A;--side-2:#3A2724;--side-head:#FFD27A;--blush:#FDE8E2;--blush-ink:#A8391F}
:root[data-accent="champagne"]{--accent:#B7862B;--accent-2:#936A1C;--accent-soft:#F7EEDB;--accent-tint:#FDFAF3;--bg:#FBF9F4;--surface-2:#F4EFE4;--line:#EAE1CF;--side:#231F17;--side-2:#322C21;--side-head:#F2D08A;--blush:#F7EEDB;--blush-ink:#7D5A17}
:root[data-accent="wine"]{--accent:#9E1B42;--accent-2:#7A1231;--accent-soft:#F7E1E8;--accent-tint:#FDF4F7;--bg:#FBF6F7;--surface-2:#F5ECEF;--line:#EBDBE0;--side:#241419;--side-2:#351E25;--side-head:#F2C94C;--blush:#F7E1E8;--blush-ink:#7A1231}
:root[data-accent="mint"]{--accent:#0E9C8A;--accent-2:#0A7A6C;--accent-soft:#DBF3EF;--accent-tint:#F2FBF9;--bg:#F5FBFA;--surface-2:#EAF5F2;--line:#D8EBE6;--side:#10231F;--side-2:#1A332D;--side-head:#FFE08A;--blush:#DBF3EF;--blush-ink:#0A6B5F}
:root[data-accent="graphite"]{--accent:#3B4252;--accent-2:#262B36;--accent-soft:#E7E9EE;--accent-tint:#F6F7F9;--bg:#F6F7F8;--surface-2:#EDEFF2;--line:#DFE2E7;--side:#15171C;--side-2:#22252D;--side-head:#E8C872;--blush:#E7E9EE;--blush-ink:#3B4252}
:root[data-accent="peach"]{--accent:#E26D8F;--accent-2:#C44F72;--accent-soft:#FCE6ED;--accent-tint:#FFF6F9;--bg:#FFF8F7;--surface-2:#FAEEEF;--line:#F2DEE2;--side:#2B2025;--side-2:#3B2D33;--side-head:#FFD1A6;--blush:#FCE6ED;--blush-ink:#A8405F}
/* ---- dark mode ---- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131318; --surface:#1C1C23; --surface-2:#25252E; --ink:#EEEAF0; --muted:#A9A2AE; --line:#33323D;
    --accent-soft:color-mix(in srgb,var(--accent) 22%,#1C1C23); --accent-tint:color-mix(in srgb,var(--accent) 8%,#1C1C23);
    --blush:color-mix(in srgb,var(--accent) 22%,#1C1C23); --blush-ink:color-mix(in srgb,var(--accent) 45%,#fff);
    --side:#0E0F16; --side-2:#1B1C27;
    --ok:#5BC48A; --ok-soft:#1C3326; --warn:#E0A94A; --warn-soft:#3A2E17; --bad:#EF7A73; --bad-soft:#3B1F1D;
    --info:#86A8F2; --info-soft:#1E2A42; --shadow:0 10px 30px rgba(0,0,0,.45);
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;--s7:#008300;--s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131318; --surface:#1C1C23; --surface-2:#25252E; --ink:#EEEAF0; --muted:#A9A2AE; --line:#33323D;
  --accent-soft:color-mix(in srgb,var(--accent) 22%,#1C1C23); --accent-tint:color-mix(in srgb,var(--accent) 8%,#1C1C23);
  --blush:color-mix(in srgb,var(--accent) 22%,#1C1C23); --blush-ink:color-mix(in srgb,var(--accent) 45%,#fff);
  --side:#0E0F16; --side-2:#1B1C27;
  --ok:#5BC48A; --ok-soft:#1C3326; --warn:#E0A94A; --warn-soft:#3A2E17; --bad:#EF7A73; --bad-soft:#3B1F1D;
  --info:#86A8F2; --info-soft:#1E2A42; --shadow:0 10px 30px rgba(0,0,0,.45);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;--s7:#008300;--s8:#e66767;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg{flex:none}
button svg,a svg,label svg,.pos-cat svg,.cart-h svg,.panel-h svg,.card-h svg,.help h3 svg{width:18px;height:18px}
/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:262px;flex:none;background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.side-brand{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none;overflow:hidden;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.logo img{width:100%;height:100%;object-fit:cover}
.logo svg{width:24px;height:24px}
.side-brand b{display:block;font-size:17px;color:#fff;letter-spacing:.2px;line-height:1.2}
.side-brand small{display:block;font-size:11px;font-weight:700;color:var(--side-head);letter-spacing:.6px;text-transform:uppercase}
.side-nav{flex:1;overflow-y:auto;padding:4px 12px 14px;scrollbar-width:thin;scrollbar-color:var(--side-2) transparent}
.side-group{font-size:11px;letter-spacing:1.5px;font-weight:800;color:var(--side-head);padding:16px 10px 6px;text-transform:uppercase}
.side-nav button{display:flex;gap:11px;align-items:center;width:100%;border:0;background:transparent;color:var(--side-ink);padding:9px 12px;border-radius:10px;font-weight:500;font-size:14.5px;text-align:left;margin:1px 0}
.side-nav button svg{width:19px;height:19px;opacity:.85}
.side-nav button:hover{background:var(--side-2)}
.side-nav button[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
.side-nav button[aria-current="page"] svg{opacity:1}
.side-nav .badge{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.side-nav button[aria-current="page"] .badge{background:rgba(255,255,255,.25)}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.15)}
.side-foot .avatar{background:var(--accent);color:#fff}
.side-foot b{display:block;font-size:13.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot small{font-size:11.5px;color:var(--side-ink);opacity:.75}
.side-foot>div:not(.avatar){min-width:0;flex:1}
.mode-pill{display:flex;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;margin:12px 16px 6px}
.mode-pill button{flex:1;border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--side-ink)}
.mode-pill button[aria-pressed="true"]{background:#fff;color:var(--side)}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 2px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.topbar-in{display:flex;align-items:center;gap:10px;padding:11px 22px}
.topbar .menu-btn{display:none}
.gsearch{position:relative;flex:1;max-width:440px}
.gsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;opacity:.85}
.gsearch input{width:100%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:9px 16px 9px 40px;font-size:14px}
.gsearch input::placeholder{color:rgba(255,255,255,.85)}
.gsearch input:focus{outline:none;background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.6)}
.gres{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);max-height:70vh;overflow:auto;z-index:50}
.gres h4{margin:0;padding:10px 14px 4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.gres button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:8px 14px;font-size:14px}
.gres button:hover,.gres button:focus-visible{background:var(--accent-tint)}
.gres button span{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
.gres .empty{padding:14px}
.spacer{flex:1}
.tb-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;height:38px;padding:0 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.tb-pill select{appearance:none;border:0;background:transparent;color:#fff;font-weight:600;font-size:13.5px;padding-right:14px;cursor:pointer}
.tb-pill select option{color:#222}
.tb-round{width:38px;padding:0;justify-content:center;position:relative}
.tb-round .dotn{position:absolute;top:-4px;right:-4px;background:#FFD24A;color:#3a2a00;border-radius:99px;font-size:10.5px;font-weight:800;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.quick{border:0;background:#fff;color:var(--accent);border-radius:999px;height:38px;padding:0 16px;font-weight:700;font-size:13.5px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.bell-pop{position:absolute;right:0;top:calc(100% + 8px);width:340px;max-width:calc(100vw - 24px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:50}
.bell-pop h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.bell-pop button{display:flex;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 14px;font-size:13.5px;align-items:flex-start}
.bell-pop button:first-of-type{border-top:0}
.bell-pop button:hover{background:var(--accent-tint)}
.bell-pop i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.content{width:100%;max-width:1320px;margin:0 auto;padding:24px 28px 56px;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
@media (max-width:1023px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .22s ease}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,8,14,.45);z-index:35}
  .scrim[hidden]{display:none}
  .topbar .menu-btn{display:inline-flex}
  .topbar-in{padding:10px 12px;gap:8px}
  .content{padding:16px 14px 110px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
}
@media (max-width:760px){
  .tb-hide-sm{display:none!important}
  .quick{padding:0 12px}
  .quick .ql{display:none}
}
/* ---------- page head ---------- */
h1{font-size:26px;line-height:1.2;margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.3px}
h2{font-size:16px;margin:0;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph-ic{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ph-ic svg{width:26px;height:26px}
.ph h1{color:var(--accent)}
.ph p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ph>.ph-t{flex:1;min-width:200px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1}
.tbtn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;color:#fff;display:inline-flex;align-items:center;gap:7px;box-shadow:0 3px 10px rgba(0,0,0,.1);white-space:nowrap}
.tbtn svg{width:16px;height:16px}
.tbtn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.tbtn.add{background:var(--b-green)}.tbtn.edit{background:var(--b-cyan)}.tbtn.del{background:var(--b-red)}
.tbtn.pdf{background:var(--accent)}.tbtn.xls{background:var(--b-purple)}.tbtn.csv{background:var(--b-blue)}.tbtn.view{background:var(--b-blue)}
.tsearch{display:flex;align-items:center;gap:10px}
.tsearch label{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;color:var(--ink)}
.tsearch label svg{width:17px;height:17px;color:var(--accent)}
.tsearch .input{flex:1}
/* ---------- data table ---------- */
.dt-wrap{border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;overflow:auto;background:var(--surface)}
.dt{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.dt th{background:var(--accent);color:#fff;text-align:left;font-weight:700;padding:12px 16px;white-space:nowrap;position:sticky;top:0;z-index:1;border-right:1px solid rgba(255,255,255,.18)}
.dt th:last-child{border-right:0}
.dt th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.dt td{padding:11px 16px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.dt td.wrap{white-space:normal;min-width:180px}
.dt tbody tr:nth-child(even){background:var(--accent-tint)}
.dt tbody tr{cursor:pointer}
.dt tbody tr:hover{background:var(--accent-soft)}
.dt tbody tr.sel{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.dt .r{text-align:right}
.dt .b{font-weight:700}
.dt tfoot td{font-weight:800;background:var(--surface-2);border-top:2px solid var(--line)}
.dt .empty{text-align:center;padding:26px;color:var(--muted);cursor:default;white-space:normal}
.dt .money-pos{color:var(--ok);font-weight:700}
.rolechip{display:inline-block;background:var(--b-blue);color:#fff;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700}
.dt-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
/* ---------- tiles / kpi ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tile .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi{background:var(--surface);border:2px solid var(--k,var(--accent));border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;text-align:left}
.kpi:hover{box-shadow:var(--shadow)}
.kpi .kh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:13.5px;color:var(--ink)}
.kpi .kh svg{width:22px;height:22px;color:var(--k,var(--accent))}
.kpi .kv{font-size:27px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .ks{font-size:12px;color:var(--muted);font-weight:500;margin-top:-4px}
/* ---------- panels & rows ---------- */
.grid2{display:grid;gap:18px}
@media (min-width:1100px){.grid2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.grid2e{display:grid;gap:18px}
@media (min-width:1000px){.grid2e{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{color:var(--ink)}
.panel-h .ic{color:var(--accent);display:inline-flex}
.panel-h .ic svg{width:18px;height:18px}
.panel-h.accent h2{color:var(--accent)}
.panel-h .count{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.panel-h .dot{width:9px;height:9px;border-radius:50%;flex:none}
.panel-sub{font-size:12.5px;color:var(--muted);padding:0 16px 10px;margin-top:-4px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.list>.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main span{font-size:13px;color:var(--muted)}
.row-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.chips{display:flex;gap:6px;flex-wrap:wrap}

#sheet{position:fixed;inset:0;z-index:60}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(Number(n)||0).toLocaleString('vi-VN')+'đ';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const p=String(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dm=s=>{if(!s)return '';const d=parseYmd(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TODAY=ymd(new Date());
const toMin=t=>{const p=String(t||'0:0').split(':').map(Number);return p[0]*60+(p[1]||0)};
const initials=n=>{const w=String(n||'?').trim().split(/\s+/);return ((w.length>1?w[w.length-2][0]:'')+w[w.length-1][0]).toUpperCase()};
const firstName=n=>{const w=String(n||'').trim().split(/\s+/);return w[w.length-1]||''};
const phoneFmt=p=>String(p||'').replace(/\D/g,'').replace(/^(\d{4})(\d{3})(\d+)$/,'$1 $2 $3');
const zaloUrl=p=>'https://zalo.me/'+String(p||'').replace(/\D/g,'');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');

const COLS=['settings','services','staff','packages','customers','appointments','courses','sales','payments','contacts','attendance','advances','roster','products','suppliers','purchases','expenses','waitlist','notes','promos','shiftreq','bonuses','users'];
const TERMS={
  spa:{org:'Spa',customer:'Khách hàng',cust:'khách',staff:'Kỹ thuật viên',course:'Liệu trình',visit:'buổi',recall:'Lâu chưa quay lại',recallSub:'Đã quá thời gian thường quay lại, chưa có lịch mới',xung:'chị'},
  nhakhoa:{org:'Nha khoa',customer:'Bệnh nhân',cust:'bệnh nhân',staff:'Bác sĩ',course:'Phác đồ',visit:'lần',recall:'Đến hạn tái khám',recallSub:'Đã đến hạn tái khám theo dịch vụ, chưa có lịch hẹn',xung:'anh/chị'}
};
const STATUS={booked:'Đã đặt',confirmed:'Đã xác nhận',arrived:'Đang phục vụ',done:'Hoàn thành',noshow:'Không đến',cancelled:'Đã hủy'};
const METHODS={cash:'Tiền mặt',transfer:'Chuyển khoản',card:'Thẻ'};
const SOURCES=['Facebook','Zalo','Giới thiệu','Google Maps','Vãng lai','TikTok','Website'];
/* ---------- state ---------- */
let mode='spa'; try{mode=localStorage.getItem('vua-mode')||'spa'}catch(e){}
if(!TERMS[mode]) mode='spa';
const S={tab:'dash',todayTab:'today',tq:{},sel:{},sort:{},gq:'',bell:false,navOpen:false,cartTab:'svc',posQ:'',calV:'week',calW:weekStartOf(TODAY),calStaff:'all',apR:'up',apS:'all',waitF:'waiting',noteF:'all',svcV:'svc',prodF:'all',suppV:'sup',poF:'all',invR:'month',invS:'all',expR:'month',promoV:'codes',camp:{seg:'bday',promoId:'',tpl:'{Xung} {ten} ơi, {spa} gửi {xung} lời chúc và ưu đãi đặc biệt tháng này. {Xung} ghé {spa} nhé!'},staffOff:false,data:{},ready:false,dbOk:null,apptDate:TODAY,apptStaff:'all',custQ:'',custF:'all',period:'cm',
  pos:{kind:'service',customerId:'',q:'',serviceId:'',packageId:'',saleId:'',amount:'',paid:'',method:'cash',staffId:'',note:'',newName:'',newPhone:'',adding:false},
  hr:{view:'overview',date:TODAY,month:TODAY.slice(0,7),week:weekStartOf(TODAY),brush:''},sheetView:null};
COLS.forEach(c=>S.data[c]=new Map());
S.cart={items:[],customerId:'',q:'',adding:false,newName:'',newPhone:'',staffId:'',discPct:'',promoCode:'',promoId:'',taxPct:'0',tip:'',method:'cash',paid:'',appointmentId:'',note:''};
let db=null, unsubs=[];
const T=()=>TERMS[mode];
const all=c=>Array.from(S.data[c].values());
const get=(c,id)=>S.data[c].get(id);
const settings=()=>get('settings','main')||{name:mode==='spa'?'Spa của bạn':'Nha khoa của bạn'};
const serviceName=id=>(get('services',id)||{}).name||'Dịch vụ';
const staffOf=id=>get('staff',id)||{name:'Chưa chọn',color:'#999'};

/* ---------- data layer ---------- */
function localKey(){return 'vua-local-'+mode}
function loadLocal(){try{const raw=JSON.parse(localStorage.getItem(localKey())||'{}');COLS.forEach(c=>S.data[c]=new Map(Object.entries(raw[c]||{}).map(([k,v])=>[k,{...v,id:k}])))}catch(e){}}
function saveLocal(){try{const o={};COLS.forEach(c=>{o[c]={};S.data[c].forEach((v,k)=>o[c][k]=v)});localStorage.setItem(localKey(),JSON.stringify(o))}catch(e){}}
function subscribe(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  COLS.forEach(c=>S.data[c]=new Map());S.ready=false;S.seedOk=false;
  if(!db){loadLocal();if(S.data.customers.size)S.seedOk=true;
    if(!S.data.customers.size){const m0=mode;(()=>{const el=document.getElementById('seed-data');if(el){try{return Promise.resolve(JSON.parse(el.textContent))}catch(e){}}return fetch('seed.json').then(r=>r.ok?r.json():null)})().then(j=>{if(!j||m0!==mode||S.data.customers.size)return;COLS.forEach(c=>{const m=j[`ws/${mode}/${c}`]||{};S.data[c]=new Map(Object.entries(m).map(([k,v])=>[k,{...v,id:k}]))});saveLocal();render()}).catch(()=>{}).finally(()=>{if(m0===mode){S.seedOk=true;render()}})}
    S.ready=true;render();return}
  const pending=new Set(COLS);
  COLS.forEach(col=>{
    const u=db.collection(`ws/${mode}/${col}`).onSnapshot(snap=>{
      const m=new Map();snap.docs.forEach(d=>m.set(d.id,{...d.data(),id:d.id}));
      S.data[col]=m;pending.delete(col);if(!pending.size){S.ready=true;S.seedOk=true}scheduleRender();
    },err=>toast('Mất kết nối dữ liệu ('+(err&&err.code)+'). Tải lại trang để thử lại.'));
    unsubs.push(u);
  });
}
async function put(col,id,obj){
  const body={...obj};delete body.id;
  if(db){
    try{await db.doc(`ws/${mode}/${col}/${id}`).set(body)}
    catch(e){toast(e&&e.code==='invalid_argument'?'Bạn chỉ có quyền xem, không lưu được thay đổi.':'Chưa lưu được, thử lại sau giây lát.');throw e}
  }else{S.data[col].set(id,{...body,id});saveLocal();scheduleRender()}
}
async function patch(col,id,part){const cur=get(col,id)||{};return put(col,id,{...cur,...part})}
async function connect(){
  try{const c=window.claude;db=(c&&typeof c.use==='function')?await c.use('db'):null}catch(e){db=null}
  S.dbOk=!!db;subscribe();
}

/* ---------- derived ---------- */
function derive(){
  const appts=all('appointments'),courses=all('courses'),sales=all('sales');
  const last={},future={},debt={},activeCourse={},visits={},spent={};
  appts.forEach(a=>{
    if(a.status==='done'){if(!last[a.customerId]||a.date>last[a.customerId].date)last[a.customerId]=a;visits[a.customerId]=(visits[a.customerId]||0)+1}
    if((a.status==='booked'||a.status==='confirmed')&&a.date>=TODAY)future[a.customerId]=true;
  });
  sales.forEach(s=>{const d=(s.total||0)-(s.paid||0);if(d>0)debt[s.customerId]=(debt[s.customerId]||0)+d;spent[s.customerId]=(spent[s.customerId]||0)+(s.paid||0)});
  courses.forEach(c=>{if((c.total||0)-(c.used||0)>0)(activeCourse[c.customerId]=activeCourse[c.customerId]||[]).push(c)});
  return {last,future,debt,activeCourse,visits,spent};
}
function contacted(cid,kind){return !!get('contacts',`${cid}_${TODAY}_${kind}`)}

/* ---------- TODAY ---------- */
function todayData(){
  const d=derive(),t=T();
  const appts=all('appointments'),custs=all('customers');
  const todays=appts.filter(a=>a.date===TODAY&&a.status!=='cancelled').sort((a,b)=>toMin(a.time)-toMin(b.time));
  const revToday=all('payments').filter(p=>p.date===TODAY).reduce((s,p)=>s+(p.amount||0),0);
  const tomorrow=addDays(TODAY,1);
  const remind=appts.filter(a=>a.date===tomorrow&&a.status==='booked').sort((a,b)=>toMin(a.time)-toMin(b.time));
  const low=[],nonext=[];
  all('courses').forEach(c=>{
    const rem=(c.total||0)-(c.used||0);const cu=get('customers',c.customerId);if(!cu||rem<=0)return;
    if(rem<=2&&!contacted(cu.id,'low'))low.push({c,cu,rem});
    const lastD=d.last[cu.id]?d.last[cu.id].date:c.startDate;
    if(!d.future[cu.id]&&lastD&&daysBetween(lastD,TODAY)>=7&&!contacted(cu.id,'nonext'))nonext.push({c,cu,rem,days:daysBetween(lastD,TODAY)});
  });
  const recall=[];
  custs.forEach(cu=>{
    const la=d.last[cu.id];if(!la||d.future[cu.id]||d.activeCourse[cu.id])return;
    const sv=get('services',la.serviceId)||{};const rd=sv.recallDays||(mode==='spa'?30:180);
    const since=daysBetween(la.date,TODAY);
    if(since>=rd-3&&!contacted(cu.id,'recall'))recall.push({cu,since,service:sv.name||'định kỳ'});
  });
  recall.sort((a,b)=>b.since-a.since);
  const bday=custs.filter(cu=>{if(!cu.birthday)return false;const b=parseYmd(cu.birthday);for(let i=0;i<=7;i++){const x=parseYmd(addDays(TODAY,i));if(x.getDate()===b.getDate()&&x.getMonth()===b.getMonth())return true}return false}).filter(cu=>!contacted(cu.id,'bday'));
  const debts=custs.filter(cu=>d.debt[cu.id]>0).map(cu=>({cu,amount:d.debt[cu.id]})).sort((a,b)=>b.amount-a.amount);
  const count=remind.length+low.length+nonext.length+recall.length+bday.length;
  return {d,t,appts,custs,todays,revToday,tomorrow,remind,low,nonext,recall,bday,debts,count};
}

const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
/* lịch trùng của nhân viên: trả về lịch hẹn chồng giờ đầu tiên (tính theo thời lượng dịch vụ của cả hai lịch) */
function staffBusy(sid,date,time,dur,exclId){if(!sid||!date||!time)return null;const t=toMin(time);
  return all('appointments').filter(a=>a.id!==exclId&&a.staffId===sid&&a.date===date&&a.status!=='cancelled'&&a.status!=='noshow').sort((a,b)=>toMin(a.time)-toMin(b.time)).find(a=>{const st=toMin(a.time);return t<st+apptDur(a)&&st<t+dur})||null}
function freeSlots(sid,date,dur,exclId,from,n){const sh=shiftOn(sid,date);if(sh&&sh.off)return [];
  const open=sh&&!sh.off?toMin(sh.start):8*60,close=sh&&!sh.off?toMin(sh.end):21*60;const nowM=date===TODAY?toMin(nowHM()):0;const out=[];
  let m=Math.max(open,Math.ceil(Math.max(nowM,toMin(from||'00:00')-120)/15)*15);
  for(;m+dur<=close&&out.length<(n||6);m+=15){const tm=hm(m);if(!staffBusy(sid,date,tm,dur,exclId))out.push(tm)}return out}
function apptForm(pre){
  pre=pre||{};const t=T();
  const services=activeServices(),staff=activeStaff();const ed=pre.id&&get('appointments',pre.id);
  const F=ed?{customerId:ed.customerId,q:'',adding:false,serviceId:ed.serviceId,staffId:ed.staffId,date:ed.date,time:ed.time,courseId:ed.courseId||'',note:ed.note||''}:{customerId:pre.customerId||'',q:'',adding:false,serviceId:pre.serviceId||'',staffId:pre.staffId||(staff[0]?staff[0].id:''),date:pre.date||(S.tab==='appts'||S.tab==='cal'?S.apptDate:TODAY),time:pre.time||'09:00',courseId:'',note:pre.note||''};
  if(F.customerId&&!ed){const ac=(derive().activeCourse[F.customerId]||[])[0];if(ac){F.courseId=ac.id;F.serviceId=ac.serviceId||F.serviceId}}
  const durOf=()=>(get('services',F.serviceId)||{}).duration||60;
  if(!ed&&!pre.staffId&&staffBusy(F.staffId,F.date,F.time,durOf(),pre.id)){const fr=staff.find(s=>!staffBusy(s.id,F.date,F.time,durOf(),pre.id)&&!(shiftOn(s.id,F.date)||{}).off);if(fr)F.staffId=fr.id}
  const draw=()=>{
    const cu=F.customerId&&get('customers',F.customerId);
    const courses=F.customerId?(derive().activeCourse[F.customerId]||[]):[];
    const dur=durOf(),conflict=staffBusy(F.staffId,F.date,F.time,dur,pre.id);
    const busyOf={};staff.forEach(s=>busyOf[s.id]=staffBusy(s.id,F.date,F.time,dur,pre.id));
    const freeStaff=staff.filter(s=>!busyOf[s.id]&&!(shiftOn(s.id,F.date)||{}).off);
    const slots=conflict?freeSlots(F.staffId,F.date,dur,pre.id,F.time,8):[];
    const sc=F.staffId?shiftCheck(F.staffId,F.date,F.time):'',shO=F.staffId&&shiftOn(F.staffId,F.date);
    const shiftWarn=sc==='off'?`${esc(staffOf(F.staffId).name)} nghỉ ngày ${dm(F.date)} theo lịch ca.`:sc==='out'?`${esc(staffOf(F.staffId).name)} làm ${esc(shO.name.toLowerCase())} ${esc(shO.start)}–${esc(shO.end)}, giờ hẹn ${esc(F.time)} nằm ngoài ca.`:'';
    openSheet(`<div class="sheet-h"><h2>${ed?'Sửa lịch hẹn':'Đặt lịch hẹn'}</h2><button class="btn sm ghost" type="button" data-act="close">Đóng</button></div>
     <form class="form" id="appt-form">
      <div class="field"><label for="af-q">${t.customer}</label>${custPickerHTML('af',cu,F)}</div>
      ${courses.length?`<div class="field"><label for="af-course">Dùng ${t.course.toLowerCase()}</label><select class="input" id="af-course"><option value="">Không, dịch vụ lẻ</option>${courses.map(c=>`<option value="${c.id}" ${F.courseId===c.id?'selected':''}>${esc(c.name)} (còn ${c.total-c.used} ${t.visit})</option>`).join('')}</select></div>`:''}
      <div class="field"><label for="af-sv">Dịch vụ</label><select class="input" id="af-sv"><option value="">Chọn dịch vụ</option>${services.map(s=>`<option value="${s.id}" ${F.serviceId===s.id?'selected':''}>${esc(s.name)} · ${money(s.price)}</option>`).join('')}</select></div>
      <div class="field"><label for="af-st">${t.staff}</label><select class="input" id="af-st">${staff.map(s=>{const sh=shiftOn(s.id,F.date),b=busyOf[s.id];return `<option value="${s.id}" ${F.staffId===s.id?'selected':''} ${b&&F.staffId!==s.id?'disabled':''}>${b?'🔒 ':''}${esc(s.name)}${b?` · kín lịch ${esc(b.time)}–${hm(toMin(b.time)+apptDur(b))}`:sh?' · '+esc(sh.off?'nghỉ':shiftShort(sh).toLowerCase()+' '+sh.start+'–'+sh.end):''}</option>`}).join('')}</select><span class="muted" style="font-size:12px">🔒 = đã có lịch trùng giờ này (${dur} phút), không chọn được.</span></div>
      <div class="form-row"><div class="field"><label for="af-date">Ngày</label><input class="input" type="date" id="af-date" value="${F.date}"></div><div class="field"><label for="af-time">Giờ</label><input class="input" type="time" id="af-time" step="900" value="${F.time}"></div></div>

        ${slots.length?`<div class="af-pick"><span>Giờ trống của ${esc(staffOf(F.staffId).name)}:</span>${slots.map(x=>`<button type="button" class="chip" data-slot="${x}">${x}</button>`).join('')}</div>`:`<div class="af-pick"><span>${esc(staffOf(F.staffId).name)} không còn giờ trống ngày ${dm(F.date)}.</span></div>`}
        ${freeStaff.length?`<div class="af-pick"><span>Rảnh lúc ${esc(F.time)}:</span>${freeStaff.map(x=>`<button type="button" class="chip" data-staff="${x.id}"><i class="staff-dot" style="background:${esc(x.color)}"></i>${esc(x.name)}</button>`).join('')}</div>`:''}</div>`:''}

      on('af-course','courseId',true);on('af-sv','serviceId',true);
      el.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click',()=>{F.time=b.dataset.slot;draw()}));
      el.querySelectorAll('[data-staff]').forEach(b=>b.addEventListener('click',()=>{F.staffId=b.dataset.staff;draw()}));on('af-st','staffId',true);on('af-date','date',true);on('af-time','time',true);

        const id=pre.id||uid();await put('appointments',id,{...(ed||{}),customerId:cid,serviceId:F.serviceId,staffId:F.staffId,date:F.date,time:F.time,status:ed?ed.status:'booked',courseId:F.courseId||'',note:F.note,createdAt:ed?ed.createdAt:TODAY});
        if(pre.onSaved)await pre.onSaved(id);S.apptDate=F.date;closeSheet();toast((ed?'Đã sửa lịch ':'Đã đặt lịch ')+F.time+' ngày '+dm(F.date));render();
      });
    });
    S.sheetView=null;
  };
  draw();
}

function custPickerHTML(p,cu,F){

function pickerResults(q){

function bindPicker(el,p,F,redraw){
  const q=el.querySelector('#'+p+'-q'),res=el.querySelector('#'+p+'-res');

  const nn=el.querySelector('#'+p+'-nn'),np=el.querySelector('#'+p+'-np');if(nn){nn.addEventListener('input',()=>F.newName=nn.value);np.addEventListener('input',()=>F.newPhone=np.value);if(!document.activeElement||document.activeElement===document.body)nn.focus()}
  const cn=el.querySelector('#'+p+'-cancelnew');if(cn)cn.addEventListener('click',()=>{F.adding=false;redraw()});
}
async function resolvePickerCustomer(F){
  if(F.customerId)return F.customerId;

/* ---------- HR (NHÂN SỰ) ---------- */
const ATT={present:['Có mặt','C','var(--ok)','st-done'],late:['Đi muộn','M','var(--warn)','st-arrived'],leave:['Nghỉ phép','P','var(--info)','st-confirmed'],absent:['Nghỉ không phép','K','var(--bad)','st-noshow']};
const PALETTE=['#1E7A68','#B0476A','#3563B8','#A8690F','#6B4FB0','#2F8F5B','#C0562F','#4A7A9E'];
const byName=(a,b)=>(a.name||'').localeCompare(b.name||'');
function activeStaff(){return all('staff').filter(s=>s.active!==false).sort(byName)}
const monthKey=d=>d.slice(0,7);
function monthLabel(mk){const p=mk.split('-');return 'Tháng '+Number(p[1])+'/'+p[0]}
function prevMonth(mk){const p=mk.split('-').map(Number);const d=new Date(p[0],p[1]-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function daysInMonth(mk){const p=mk.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
function attDoc(sid,mk){return get('attendance',`${sid}_${mk}`)||{staffId:sid,month:mk,days:{}}}
function attDay(sid,date){return (attDoc(sid,monthKey(date)).days||{})[date.slice(8)]}
async function setAtt(sid,date,part){
  const mk=monthKey(date),doc=attDoc(sid,mk),dd=date.slice(8);
  const days={...(doc.days||{})};const cur={...(days[dd]||{}),...part};
  if(cur.s===null){delete days[dd]}else days[dd]=cur;
  await put('attendance',`${sid}_${mk}`,{staffId:sid,month:mk,days});
}
function nowHM(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function monthStats(sid,mk){
  const days=attDoc(sid,mk).days||{};const c={present:0,late:0,leave:0,absent:0};
  Object.values(days).forEach(x=>{if(x&&c[x.s]!==undefined)c[x.s]++});
  const done=all('appointments').filter(a=>a.staffId===sid&&a.status==='done'&&a.date&&a.date.startsWith(mk));
  const adv=all('advances').filter(a=>a.staffId===sid&&a.date&&a.date.startsWith(mk));
  const tips=all('sales').filter(s=>s.staffId===sid&&s.tip&&monthOf(s.date)===mk).reduce((x,s)=>x+(s.tip||0),0);
  const bonusList=all('bonuses').filter(b=>b.staffId===sid&&b.month===mk);const bonus=bonusList.reduce((x,b)=>x+(b.amount||0),0);
  return {...c,tips,bonus,bonusList,cong:c.present+c.late+c.leave,served:done.length,sales:done.reduce((s,a)=>s+(a.value||0),0),commission:done.reduce((s,a)=>s+(a.commission||0),0),adv:adv.reduce((s,a)=>s+(a.amount||0),0),advList:adv};
}
function payroll(s,mk){
  const st=settings(),std=st.workDays||26,pen=st.latePenalty!=null?st.latePenalty:30000;
  const m=monthStats(s.id,mk);
  const byDay=Math.round((s.baseSalary||0)*Math.min(m.cong,std)/std);
  const late=m.late*pen;
  return {...m,std,pen,base:s.baseSalary||0,byDay,latePen:late,net:byDay+m.commission+(m.tips||0)+(m.bonus||0)-late-m.adv};
}

function attPill(a){if(!a||!a.s)return '<span class="pill st-booked">Chưa chấm công</span>';const x=ATT[a.s];return `<span class="pill ${x[3]}">${x[0]}${a.in?' · '+esc(a.in):''}${a.out?'–'+esc(a.out):''}</span>`}

function copyPayroll(){
  const mk=S.hr.month;const rows=activeStaff().map(s=>({s,p:payroll(s,mk)}));
  const head=['Nhân viên','Lương cơ bản','Công','Lương theo công','Hoa hồng','Tip','Thưởng','Phạt muộn','Tạm ứng','Thực lĩnh'];
  const lines=[settings().name+' – Bảng lương '+monthLabel(mk).toLowerCase(),head.join('\t'),...rows.map(({s,p})=>[s.name,p.base,p.cong+'/'+p.std,p.byDay,p.commission,p.tips||0,p.bonus||0,p.latePen,p.adv,p.net].join('\t'))];
  const txt=lines.join('\n');
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Đã chép bảng lương'),()=>toast('Trình duyệt không cho chép, hãy chụp màn hình.'));
}

/* ---------- XẾP CA ---------- */
const DEFAULT_SHIFTS=[{id:'S',name:'Ca sáng',start:'08:30',end:'14:30',color:'#3563B8'},{id:'C',name:'Ca chiều',start:'14:00',end:'20:30',color:'#A8690F'},{id:'F',name:'Cả ngày',start:'08:30',end:'17:30',color:'#1E7A68'}];
function shiftsList(){const s=settings().shifts;return Array.isArray(s)&&s.length?s:DEFAULT_SHIFTS}
function shiftById(id){return shiftsList().find(x=>x.id===id)}
const shiftShort=sh=>{if(sh.off)return 'Nghỉ';const s=String(sh.name||'').replace(/^Ca\s+/i,'');return s.charAt(0).toUpperCase()+s.slice(1)};
function weekStartOf(d){return addDays(d,-((parseYmd(d).getDay()+6)%7))}
function rosDoc(sid,mk){return get('roster',`${sid}_${mk}`)||{staffId:sid,month:mk,days:{}}}
function rosVal(sid,date){return (rosDoc(sid,monthKey(date)).days||{})[date.slice(8)]||''}
function shiftOn(sid,date){const v=rosVal(sid,date);if(!v)return null;if(v==='off')return {off:true};return shiftById(v)||null}
function shiftStartOf(sid,date){const sh=shiftOn(sid,date);return sh&&!sh.off?sh.start:(settings().shiftStart||'08:30')}
const shiftHours=sh=>sh&&!sh.off?Math.max(0,toMin(sh.end)-toMin(sh.start))/60:0;
function shiftText(sh){return !sh?'Chưa xếp ca':sh.off?'Nghỉ theo lịch ca':`${sh.name} ${sh.start}–${sh.end}`}
function shiftTag(sh){return `<span class="shifttag${sh&&sh.off?' off':''}"><i style="background:${sh&&!sh.off?esc(sh.color||'#999'):'var(--line)'}"></i>${esc(shiftText(sh))}</span>`}
/* trả về '' nếu ổn, 'off' nếu nghỉ, 'out' nếu ngoài giờ ca, null nếu chưa xếp ca */
function shiftCheck(sid,date,time){const sh=shiftOn(sid,date);if(!sh)return null;if(sh.off)return 'off';const t=toMin(time);return (t<toMin(sh.start)||t>=toMin(sh.end))?'out':''}
async function setRosMany(list){
  const docs={};
  list.forEach(({sid,date,val})=>{const mk=monthKey(date),k=`${sid}_${mk}`;if(!docs[k])docs[k]={staffId:sid,month:mk,days:{...(rosDoc(sid,mk).days||{})}};if(val)docs[k].days[date.slice(8)]=val;else delete docs[k].days[date.slice(8)]});
  for(const [k,d] of Object.entries(docs))await put('roster',k,d);
}
function hrRoster(){
  const H0=pageHead('roster','Xếp ca làm việc','Lịch ca theo tuần, dùng để tính đi muộn và cảnh báo khi đặt lịch');
  const W=S.hr.week,days=[0,1,2,3,4,5,6].map(i=>addDays(W,i)),staff=activeStaff(),shifts=shiftsList(),thisW=weekStartOf(TODAY);
  if(!S.hr.brush||(S.hr.brush!=='off'&&!shiftById(S.hr.brush)))S.hr.brush=shifts[0].id;
  const B=S.hr.brush;
  const brush=(k,l,c)=>`<button class="chip" type="button" data-act="ros-brush" data-b="${esc(k)}" aria-pressed="${B===k}"><i class="staff-dot" style="background:${c}"></i>${l}</button>`;
  let h=H0+`<div class="head"><div><h2 style="font-size:18px">Tuần ${dm(days[0])} – ${dm(days[6])}/${days[6].slice(0,4)}</h2><span class="muted" style="font-size:13px">Chọn loại ca, rồi bấm vào ô để xếp. Bấm lại ô đó để xóa.</span></div>
   <div class="chips"><button class="chip" type="button" data-act="ros-week" data-n="-7">‹ Tuần trước</button><button class="chip" type="button" data-act="ros-week" data-n="0" aria-pressed="${W===thisW}">Tuần này</button><button class="chip" type="button" data-act="ros-week" data-n="7">Tuần sau ›</button></div></div>
   <div class="chips" style="margin-bottom:12px">${shifts.map(s=>brush(s.id,`${esc(s.name)} <span class="num" style="font-weight:500">${esc(s.start)}–${esc(s.end)}</span>`,esc(s.color||'#999'))).join('')}${brush('off','Nghỉ','var(--line)')}</div>`;
  let g=`<table class="attgrid rosgrid"><thead><tr><th class="sticky">Nhân viên</th>${days.map(d=>`<th class="${d===TODAY?'sel':''}"><div>${WD[parseYmd(d).getDay()]}<small>${dm(d)}</small></div></th>`).join('')}<th>Giờ/mục tiêu</th></tr></thead><tbody>`;
  const working=days.map(()=>0),violations=[];
  staff.forEach(s=>{let hrs=0;g+=`<tr><th class="sticky">${esc(s.name)}</th>`;
    days.forEach((d,i)=>{const sh=shiftOn(s.id,d);hrs+=shiftHours(sh);if(sh&&!sh.off)working[i]++;
      const rq=reqDay(s.id,d),vio=reqViolation(s.id,d);if(vio)violations.push({s,d,vio});
      const cls=(!sh?'':sh.off?' off':' on')+(vio?' bad':''),lab=!sh?(rq&&rq.off?'Xin nghỉ':'+'):`${esc(shiftShort(sh))}${sh.off?'':`<small class="num">${esc(sh.start)}–${esc(sh.end)}</small>`}`;

  g+=`</tbody><tfoot><tr><th class="sticky">Số người đi làm</th>${working.map(n=>`<td class="num${n?'':' zero'}">${n}</td>`).join('')}<td></td></tr></tfoot></table>`;

/* ---------- theme ---------- */
function applyTheme(){
  const st=settings();let acc=st.accent,th=st.theme;
  try{acc=acc||localStorage.getItem('vua-accent');th=th||localStorage.getItem('vua-theme')}catch(e){}
  const r=document.documentElement;
  if(acc&&acc!=='rose')r.dataset.accent=acc;else delete r.dataset.accent;
  if(th==='light'||th==='dark')r.dataset.theme=th;else delete r.dataset.theme;
}
async function setThemePref(part){try{if(part.accent)localStorage.setItem('vua-accent',part.accent);if(part.theme)localStorage.setItem('vua-theme',part.theme)}catch(e){}await put('settings','main',{...settings(),...part})}

const short=v=>{v=Math.round(v||0);const a=Math.abs(v);return a>=1e9?(Math.round(v/1e8)/10+'').replace('.',',')+' tỷ':a>=1e6?(Math.round(v/1e5)/10+'').replace('.',',')+'tr':a>=1e3?Math.round(v/1e3)+'k':String(v)};

const stripTags=s=>String(s??'').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();

function staffCode(s){const i=all('staff').sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||'')||a.id.localeCompare(b.id)).findIndex(x=>x.id===s.id);return 'NV'+pad(i+1)}

/* ---------- generic form sheet ---------- */
/* fields: {k,l,type:text|money|number|date|time|select|textarea|check|tel|email, opts:[[v,l]], ph, req, row} */
function formSheet(o){
  const d=o.data||{};let html='',i=0;const F=o.fields;
  const fh=f=>{const id='ff-'+f.k,v=d[f.k]??f.def??'';
    if(f.type==='check')return `<label style="display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px"><input type="checkbox" id="${id}" ${v?'checked':''}> ${f.l}</label>`;
    let inp;
    if(f.type==='select')inp=`<select class="input" id="${id}">${f.opts.map(([ov,ol])=>`<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')inp=`<textarea class="input" id="${id}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    else{const t=f.type==='money'||f.type==='number'?'text':f.type||'text';inp=`<input class="input${f.type==='money'||f.type==='number'?' num':''}" id="${id}" type="${t}" ${f.type==='money'||f.type==='number'?'inputmode="numeric"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>`}
    return `<div class="field"><label for="${id}">${f.l}${f.req?' *':''}</label>${inp}</div>`};
  while(i<F.length){const f=F[i];if(f.row){const grp=F.slice(i).filter((x,j)=>j<3&&x.row===f.row);let n=0;while(i+n<F.length&&F[i+n].row===f.row)n++;const g=F.slice(i,i+n);html+=`<div class="${g.length>2?'form-row3':'form-row'}">${g.map(fh).join('')}</div>`;i+=n}else{html+=fh(f);i++}}
  openSheet(`<div class="sheet-h"><h2>${o.title}</h2><button class="btn sm ghost" type="button" data-act="close">Đóng</button></div>
   <form class="form" id="gform">${o.before||''}${html}${o.after||''}<button class="btn primary" type="submit">${o.submit||'Lưu'}</button></form>`,el=>{
    el.querySelector('#gform').addEventListener('submit',async e=>{e.preventDefault();const v={};
      for(const f of F){const x=el.querySelector('#ff-'+f.k);if(!x)continue;v[f.k]=f.type==='check'?x.checked:(f.type==='money'||f.type==='number')?numIn(x.value):x.value.trim();if(f.req&&(v[f.k]===''||v[f.k]==null))return toast('Nhập '+f.l.toLowerCase()+'.')}
      const r=await o.onSave(v,el);if(r!==false)closeSheet()});
    const first=el.querySelector('#gform input,#gform select,#gform textarea');if(first&&window.innerWidth>700)first.focus();

function promoValid(p,sub){return p&&p.active!==false&&(!p.start||p.start<=TODAY)&&(!p.end||p.end>=TODAY)&&(!p.minSpend||sub>=p.minSpend)}
function cartCalc(C){
  const sub=C.items.reduce((s,i)=>s+i.price*i.qty,0);const disc=Math.round(sub*Math.min(100,numIn(C.discPct))/100);
  const pr=C.promoId&&get('promos',C.promoId);let promoDisc=0;
  if(pr&&promoValid(pr,sub))promoDisc=pr.type==='pct'?Math.round((sub-disc)*pr.value/100):Math.min(sub-disc,pr.value||0);
  const after=sub-disc-promoDisc,tax=Math.round(after*numIn(C.taxPct)/100),tip=numIn(C.tip),total=after+tax+tip;
  const paid=C.paid===''?total:Math.min(total,numIn(C.paid));
  return {sub,disc,promoDisc,promo:pr,discount:disc+promoDisc,after,tax,tip,total,paid,owe:total-paid};
}

  S.cart=newCart();S.posQ='';render();

/* ---------- BOOKING CALENDAR (week / day) ---------- */
function viewCal(){
  const V=S.calV;
  let h=pageHead('cal','Lịch đặt chỗ',V==='week'?'Tổng quan lịch hẹn theo tuần, bấm vào ô trống để đặt lịch':'Lịch hẹn theo ngày và theo '+T().staff.toLowerCase(),segRow('cal-v',V,[['week','Theo tuần'],['day','Theo ngày']]));
  if(V==='day')return h+viewAppts();
  const W=S.calW,days=[0,1,2,3,4,5,6].map(i=>addDays(W,i)),stf=S.calStaff;
  let ap=all('appointments').filter(a=>a.date>=days[0]&&a.date<=days[6]);if(stf!=='all')ap=ap.filter(a=>a.staffId===stf);
  let h0=8,h1=20;ap.forEach(a=>{const hh=Math.floor(toMin(a.time)/60);h0=Math.min(h0,hh);h1=Math.max(h1,hh)});
  const nb=(act,n,l,cls)=>`<button class="tbtn ${cls}" type="button" data-act="${act}" data-n="${n}">${l}</button>`;
  h+=`<div class="toolbar">${nb('cal-w',-7,'◀ Tuần trước','edit')}${nb('cal-w',0,I('appts')+'Tuần này','pdf')}${nb('cal-w',7,'Tuần sau ▶','edit')}<b style="color:var(--accent);font-size:18px;margin-left:8px">${dm(days[0])} – ${dm(days[6])}/${days[6].slice(0,4)}</b><span class="grow"></span><span class="muted" style="font-size:13px">${ap.filter(a=>a.status!=='cancelled').length} lịch trong tuần</span></div>
   <div class="chips">${Object.entries(STATUS).map(([k,l])=>`<span class="ev ${k}" style="cursor:default;font-weight:700;padding:5px 11px">${l}</span>`).join('')}</div>
   <div class="chips"><button class="chip" type="button" data-act="cal-staff" data-id="all" aria-pressed="${stf==='all'}">Tất cả ${T().staff.toLowerCase()}</button>${activeStaff().map(s=>`<button class="chip" type="button" data-act="cal-staff" data-id="${s.id}" aria-pressed="${stf===s.id}"><i class="staff-dot" style="background:${esc(s.color)}"></i>${esc(s.name)}</button>`).join('')}</div>`;
  let g=`<div class="cal-wrap"><div class="cal"><div class="ch">Giờ</div>${days.map(d=>`<div class="ch ${d===TODAY?'today':''}">${WD[parseYmd(d).getDay()]} ${Number(d.slice(8))}/${Number(d.slice(5,7))}</div>`).join('')}`;
  for(let hr=h0;hr<=h1;hr++){g+=`<div class="th">${pad(hr)}:00</div>`;
    days.forEach(d=>{const list=ap.filter(a=>a.date===d&&Math.floor(toMin(a.time)/60)===hr).sort((a,b)=>toMin(a.time)-toMin(b.time));
      g+=`<div class="cc ${d<TODAY?'past':''}" data-act="cal-new" data-d="${d}" data-h="${pad(hr)}:00">${list.map(a=>`<button type="button" class="ev ${a.status}" data-act="appt" data-id="${a.id}" title="${esc(custName(a.customerId)+' · '+serviceName(a.serviceId)+' · '+staffOf(a.staffId).name)}"><b>${esc(a.time)} ${esc(custName(a.customerId))}</b><span>${esc(serviceName(a.serviceId))}</span><span><i class="staff-dot" style="background:${esc(staffOf(a.staffId).color)}"></i>${esc(staffOf(a.staffId).name)}</span></button>`).join('')}</div>`})}
  g+=`</div></div>`;
  return h+g+`<button class="btn primary fab" type="button" data-act="new-appt">+ Đặt lịch</button>`;
}

const WSTAT={waiting:['Đang chờ','st-arrived'],booked:['Đã xếp lịch','st-done'],cancelled:['Đã hủy','st-cancelled']};
/* đồng bộ khách trong danh sách chờ sang dữ liệu Khách hàng: tìm theo SĐT (hoặc tên nếu không có SĐT), có thì cập nhật, chưa có thì tạo mới */
async function syncWaitCustomer(w,extra){
  extra=extra||{};const phone=String(w.phone||'').replace(/\D/g,'');const name=String(w.name||'').trim();if(!name&&!phone)return '';
  let cu=(w.customerId&&get('customers',w.customerId))||(phone&&all('customers').find(c=>c.phone===phone))||(!phone&&name&&all('customers').find(c=>norm(c.name)===norm(name)&&!c.phone))||null;
  const svc=w.serviceId?serviceName(w.serviceId):'';
  const tagAdd=t=>{const tags=String((cu&&cu.tags)||'').split(',').map(x=>x.trim()).filter(Boolean);if(!tags.includes(t))tags.push(t);return tags.join(', ')};
  if(cu){const upd={};
    if(name&&name!==cu.name)upd.name=name;if(phone&&phone!==cu.phone)upd.phone=phone;
    if(extra.xung)upd.xung=extra.xung;if(extra.birthday&&!cu.birthday)upd.birthday=extra.birthday;if(extra.source&&!cu.source)upd.source=extra.source;
    if(w.status==='waiting')upd.tags=tagAdd('Chờ lịch');else if(/Chờ lịch/.test(cu.tags||''))upd.tags=String(cu.tags).split(',').map(x=>x.trim()).filter(x=>x&&x!=='Chờ lịch').join(', ');
    if(upd.tags===cu.tags)delete upd.tags;
    if(Object.keys(upd).length)await put('customers',cu.id,{...cu,...upd});
  }else{const id=uid();cu={id};await put('customers',id,{name:name||phone,phone,xung:extra.xung||T().xung,birthday:extra.birthday||'',source:extra.source||'Vãng lai',tags:w.status==='waiting'?'Chờ lịch':'',note:'',createdAt:TODAY,fromWaitlist:true})}
  const noteTxt=`Danh sách chờ: ${svc||'chưa rõ dịch vụ'}${w.date?' · muốn ngày '+dm(w.date):''}${w.slot?' · '+w.slot:''}${w.staffId?' · muốn '+staffOf(w.staffId).name:''}${w.note?' · '+w.note:''}`;
  const nid=`wl_${w.id}`;const ex=get('notes',nid);
  if(!ex||ex.text!==noteTxt)await put('notes',nid,{customerId:cu.id,kind:'Nhắc việc',text:noteTxt,author:'Danh sách chờ',date:(ex&&ex.date)||TODAY,pinned:false});
  return cu.id;
}

const CARE={new:['Cần liên hệ','st-arrived'],contacted:['Đã liên hệ','st-booked'],consulted:['Đã tư vấn','st-confirmed'],booked:['Đã đặt lịch','st-done'],done:['Hoàn tất','st-done']};
function leadInfo(c,d){
  const ws=all('waitlist').filter(w=>w.customerId===c.id).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));const w=ws[0];
  let origin=c.source||'Khác';
  if(w&&w.webCode&&/^CHAT/.test(w.webCode))origin='Chat tư vấn';else if(w&&w.webCode)origin='Đặt lịch online';else if(w)origin='Danh sách chờ · '+(c.source||'');
  const need=w?[w.serviceId?serviceName(w.serviceId):'',w.date&&!/^CHAT/.test(w.webCode||'')?('muốn '+dm(w.date)+(w.slot?' '+w.slot:'')):'',(w.note||'').replace(/^Đặt online [A-Z0-9]+: /,'').replace(/^Khách chat "Tư vấn trực tiếp" để lại SĐT – cần gọi lại tư vấn\. ?/,'').slice(0,140)].filter(Boolean).join(' · '):(c.note||'');
  let st=(c.care&&c.care.status)||'new';if(st!=='done'&&d.future[c.id]&&(st==='new'||st==='contacted'||st==='consulted'))st='booked';
  return {w,origin,need,st,paid:w&&w.paid};
}

   <div class="nl-grid">${list.length?list.slice(0,12).map(({c,origin,need,st,paid})=>`<article class="nl-card ${st==='new'?'is-new':''}">
     <div class="nl-top"><div style="min-width:0"><b class="nl-name">${esc(c.name)}</b><span class="nl-ph">${esc(phoneFmt(c.phone)||'Chưa có SĐT')}</span></div><span class="pill ${CARE[st][1]}">${CARE[st][0]}</span></div>

async function readSheetFile(file){
  if(/\.csv$/i.test(file.name))return parseCSV(await file.text());
  if(/\.xlsx$/i.test(file.name)&&typeof DecompressionStream!=='undefined'){try{return await readXlsxNative(await file.arrayBuffer())}catch(e){console.warn('xlsx native',e)}}
  const X=await loadXlsx();const wb=X.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
  return X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
}
function pickProductFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv';inp.style.display='none';document.body.appendChild(inp);
  inp.addEventListener('change',async()=>{const f=inp.files[0];inp.remove();if(!f)return;toast('Đang đọc file '+f.name+'…');
    let rows;try{rows=await readSheetFile(f)}catch(e){return toast(/\.csv$/i.test(f.name)?'Không đọc được file CSV.':'Không đọc được file Excel. Kiểm tra kết nối mạng hoặc lưu file dạng CSV rồi thử lại.')}
    importPreview(f.name,rows)});inp.click()}
function importPreview(fname,rows){
  rows=(rows||[]).map((r,i)=>{const x=Array.isArray(r)?r.slice():[];x._line=i+1;return x}).filter(r=>r.some(c=>String(c??'').trim()!==''));
  let hi=rows.findIndex(r=>r.filter(c=>mapHeader(c)).length>=2);if(hi<0)return toast('Không tìm thấy dòng tiêu đề (cần ít nhất cột “Tên sản phẩm” và “Giá bán”).');
  const map=rows[hi].map(mapHeader);if(!map.includes('name'))return toast('File thiếu cột “Tên sản phẩm”.');
  const prods=all('products');const bySku={},byName={};prods.forEach(p=>{if(p.sku)bySku[String(p.sku).trim()]=p;byName[norm(p.name).trim()]=p});
  const items=[],errs=[];const seen=new Set();
  rows.slice(hi+1).forEach((r,i)=>{const o={};map.forEach((f,j)=>{if(f&&o[f]==null)o[f]=r[j]});const line=r._line;
    const name=String(o.name??'').trim();if(!name){errs.push(`Dòng ${line}: thiếu tên sản phẩm`);return}
    const sku=String(o.sku??'').trim().replace(/\.0+$/,'');const key=sku||norm(name);if(seen.has(key)){errs.push(`Dòng ${line}: trùng “${sku||name}” trong file, bỏ qua`);return}seen.add(key);
    const price=moneyIn(o.price),cost=moneyIn(o.cost),stock=moneyIn(o.stock),min=moneyIn(o.minStock);
    if(o.price!=null&&String(o.price).trim()!==''&&price==null){errs.push(`Dòng ${line}: giá bán không hợp lệ`);return}
    const ex=(sku&&bySku[sku])||byName[norm(name).trim()];
    items.push({line,ex,d:{name,sku,category:String(o.category??'').trim(),cost,price,stock,minStock:min,unit:String(o.unit??'').trim(),supplier:String(o.supplier??'').trim()}})});
  const nNew=items.filter(x=>!x.ex).length,nUp=items.length-nNew;
  const shown=items.slice(0,50);
  openSheet(`<div class="sheet-h"><h2>Nhập sản phẩm từ Excel</h2><button class="btn sm ghost" type="button" data-act="close">Đóng</button></div>
   <div class="infobox"><b>${esc(fname)}</b> · ${items.length} sản phẩm hợp lệ: <b style="color:var(--ok)">${nNew} mới</b>, <b style="color:var(--info)">${nUp} đã có</b>${errs.length?`, <b style="color:var(--bad)">${errs.length} dòng lỗi</b>`:''}.<br>Cột nhận diện: ${map.filter(Boolean).map(f=>PROD_COLS.find(c=>c[0]===f)[1]).join(', ')}.</div>
   ${errs.length?`<div class="errbox" style="max-height:110px;overflow:auto">${errs.slice(0,30).map(esc).join('<br>')}${errs.length>30?'<br>…':''}</div>`:''}
   ${nUp?`<div class="field"><label for="imp-mode">Sản phẩm đã có (trùng mã vạch hoặc tên)</label><select class="input" id="imp-mode"><option value="update">Cập nhật thông tin theo file (giữ nguyên ô để trống)</option><option value="addstock">Cập nhật thông tin và CỘNG thêm tồn kho</option><option value="skip">Bỏ qua, chỉ thêm sản phẩm mới</option></select></div>`:''}
   <div class="dt-wrap" style="max-height:340px"><table class="dt"><thead><tr><th></th><th>Mã vạch</th><th>Tên sản phẩm</th><th>Nhóm</th><th class="r">Giá vốn</th><th class="r">Giá bán</th><th class="r">Tồn</th><th>Nhà cung cấp</th></tr></thead><tbody>${shown.map(x=>`<tr style="cursor:default"><td>${x.ex?'<span class="tag" style="background:var(--info-soft);color:var(--info)">Đã có</span>':'<span class="tag ok">Mới</span>'}</td><td>${esc(x.d.sku||'—')}</td><td><b>${esc(x.d.name)}</b></td><td>${esc(x.d.category||'')}</td><td class="r">${x.d.cost!=null?money(x.d.cost):'—'}</td><td class="r">${x.d.price!=null?money(x.d.price):'—'}</td><td class="r">${x.d.stock!=null?x.d.stock:'—'}</td><td>${esc(x.d.supplier||'')}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Không có dòng hợp lệ.</td></tr>'}</tbody></table></div>
   ${items.length>50?`<span class="muted" style="font-size:12.5px">Đang xem trước 50/${items.length} dòng, khi nhập sẽ lưu tất cả.</span>`:''}
   <button class="btn primary" type="button" id="imp-go" ${items.length?'':'disabled'}>Nhập ${items.length} sản phẩm</button>`,el=>{
    const go=el.querySelector('#imp-go');go.addEventListener('click',async()=>{go.disabled=true;go.textContent='Đang nhập…';
      const mode=(el.querySelector('#imp-mode')||{}).value||'update';const sups={};all('suppliers').forEach(x=>sups[norm(x.name).trim()]=x.id);
      let add=0,upd=0,skip=0,newSup=0;
      for(const x of items){if(x.ex&&mode==='skip'){skip++;continue}
        let supplierId;if(x.d.supplier){const k=norm(x.d.supplier).trim();if(!sups[k]){sups[k]=uid();await put('suppliers',sups[k],{name:x.d.supplier});newSup++}supplierId=sups[k]}
        const d={name:x.d.name};if(x.d.sku)d.sku=x.d.sku;if(x.d.category)d.category=x.d.category;if(x.d.cost!=null)d.cost=x.d.cost;if(x.d.price!=null)d.price=x.d.price;if(x.d.minStock!=null)d.minStock=x.d.minStock;if(x.d.unit)d.unit=x.d.unit;if(supplierId)d.supplierId=supplierId;
        if(x.ex){const cur=get('products',x.ex.id)||x.ex;if(x.d.stock!=null)d.stock=mode==='addstock'?(cur.stock||0)+x.d.stock:x.d.stock;await put('products',x.ex.id,{...cur,...d});upd++}
        else{await put('products',uid(),{unit:'cái',minStock:5,stock:0,cost:0,price:0,active:true,category:'Khác',sku:'',...d,stock:x.d.stock!=null?x.d.stock:0});add++}}
      closeSheet();S.prodF='all';render();toast(`Đã nhập: ${add} mới, ${upd} cập nhật${skip?', '+skip+' bỏ qua':''}${newSup?', thêm '+newSup+' nhà cung cấp':''}`)});
  });S.sheetView=null;
}

function poTotal(p){return (p.lines||[]).reduce((s,l)=>s+(l.qty||0)*(l.cost||0),0)}
function poForm(id,preLow,supId){
  const po=id?get('purchases',id):{date:TODAY,status:'ordered',supplierId:supId||(preLow&&preLow[0]&&preLow[0].supplierId)||'',lines:preLow?preLow.map(p=>({productId:p.id,qty:Math.max(1,(p.minStock||0)*2-(p.stock||0)),cost:p.cost||0})):[{productId:'',qty:1,cost:0}]};
  const F={...po,lines:(po.lines||[]).map(l=>({...l}))};const prods=all('products').sort(byName),sups=all('suppliers').sort(byName);
  const draw=()=>{
    openSheet(`<div class="sheet-h"><h2>${id?'Sửa đơn nhập '+esc(po.code||''):'Tạo đơn nhập hàng'}</h2><button class="btn sm ghost" type="button" data-act="close">Đóng</button></div>
     <form class="form" id="pof"><div class="form-row"><div class="field"><label for="po-s">Nhà cung cấp</label><select class="input" id="po-s"><option value="">— Chọn —</option>${sups.map(s=>`<option value="${s.id}" ${F.supplierId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label for="po-d">Ngày đặt</label><input class="input" type="date" id="po-d" value="${esc(F.date)}"></div></div>
     <div class="field"><label>Mặt hàng</label><div style="display:flex;flex-direction:column;gap:8px">${F.lines.map((l,i)=>`<div style="display:grid;grid-template-columns:minmax(0,2fr) 70px minmax(0,1fr) 34px;gap:6px;align-items:center"><select class="input" data-l="${i}" data-f="productId"><option value="">Chọn sản phẩm</option>${prods.map(p=>`<option value="${p.id}" ${l.productId===p.id?'selected':''}>${esc(p.name)} (tồn ${p.stock||0})</option>`).join('')}</select><input class="input num" data-l="${i}" data-f="qty" inputmode="numeric" value="${l.qty}" aria-label="Số lượng"><input class="input num" data-l="${i}" data-f="cost" inputmode="numeric" value="${l.cost}" aria-label="Đơn giá nhập"><button class="btn sm danger" type="button" data-rm="${i}" aria-label="Xóa dòng">×</button></div>`).join('')}</div>
     <button class="btn sm" type="button" id="po-add" style="align-self:flex-start;margin-top:6px">+ Thêm dòng</button></div>
     <div class="infobox"><div class="total"><span>Tổng tiền đơn</span><b>${money(poTotal(F))}</b></div></div>
     <div class="field"><label for="po-n">Ghi chú</label><input class="input" id="po-n" value="${esc(F.note||'')}"></div>
     <button class="btn primary" type="submit">Lưu đơn nhập</button></form>`,el=>{
      el.querySelector('#po-s').addEventListener('change',e=>F.supplierId=e.target.value);el.querySelector('#po-d').addEventListener('change',e=>F.date=e.target.value);el.querySelector('#po-n').addEventListener('input',e=>F.note=e.target.value);
      el.querySelectorAll('[data-l]').forEach(x=>x.addEventListener('change',()=>{const l=F.lines[x.dataset.l];if(x.dataset.f==='productId'){l.productId=x.value;const p=get('products',x.value);if(p&&!l.cost)l.cost=p.cost||0}else l[x.dataset.f]=numIn(x.value);draw()}));
      el.querySelectorAll('[data-rm]').forEach(x=>x.addEventListener('click',()=>{F.lines.splice(Number(x.dataset.rm),1);if(!F.lines.length)F.lines.push({productId:'',qty:1,cost:0});draw()}));
      el.querySelector('#po-add').addEventListener('click',()=>{F.lines.push({productId:'',qty:1,cost:0});draw()});
      el.querySelector('#pof').addEventListener('submit',async e=>{e.preventDefault();const lines=F.lines.filter(l=>l.productId&&l.qty>0);if(!F.supplierId)return toast('Chọn nhà cung cấp.');if(!lines.length)return toast('Thêm ít nhất một mặt hàng.');
        const code=po.code||'PN-'+pad(all('purchases').length+1).padStart(4,'0');await put('purchases',id||uid(),{...po,...F,lines,code,total:poTotal({lines})});closeSheet();toast('Đã lưu đơn '+code);S.suppV='po';render()});
    });S.sheetView=null};
  draw();
}
async function poReceive(id){
  const po=get('purchases',id);if(!po||po.status!=='ordered')return toast('Chỉ nhận hàng cho đơn đang ở trạng thái “Đã đặt hàng”.');
  confirmSheet('Nhận hàng?',`Cộng <b>${(po.lines||[]).reduce((s,l)=>s+l.qty,0)}</b> sản phẩm vào kho và ghi chi phí nhập hàng <b>${money(poTotal(po))}</b>.`,'Nhận hàng',async()=>{
    for(const l of po.lines||[]){const p=get('products',l.productId);if(p)await patch('products',p.id,{stock:(p.stock||0)+(l.qty||0),cost:l.cost||p.cost,supplierId:p.supplierId||po.supplierId})}
    const eid=uid();await put('expenses',eid,{date:TODAY,category:'Nhập hàng',title:'Nhập hàng '+(po.code||'')+' – '+((get('suppliers',po.supplierId)||{}).name||''),amount:poTotal(po),method:'transfer',payee:(get('suppliers',po.supplierId)||{}).name||'',purchaseId:id});
    await patch('purchases',id,{status:'received',receivedAt:TODAY,expenseId:eid});toast('Đã nhập kho và ghi chi phí')});
}

function expForm(id){
  const e=id?get('expenses',id):{date:TODAY,category:EXP_CATS[0],method:'cash'};
  formSheet({title:id?'Sửa khoản chi':'Thêm khoản chi',data:e,
    fields:[{k:'title',l:'Nội dung',req:1,ph:'VD: Tiền điện tháng 9'},{k:'category',l:'Nhóm chi phí',type:'select',opts:EXP_CATS.map(c=>[c,c]),row:'a'},{k:'amount',l:'Số tiền (đ)',type:'money',req:1,row:'a'},{k:'date',l:'Ngày chi',type:'date',row:'b'},{k:'method',l:'Hình thức',type:'select',opts:Object.entries(METHODS2),row:'b'},{k:'payee',l:'Người nhận / nhà cung cấp'},{k:'note',l:'Ghi chú',type:'textarea',rows:2}],
    onSave:async v=>{if(!v.amount){toast('Nhập số tiền.');return false}await put('expenses',id||uid(),{...e,...v});toast('Đã lưu khoản chi')}});
}
function viewExp(){
  const R=S.expR;const rows=all('expenses').filter(e=>inRange(e.date,R)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const tot=rows.reduce((s,e)=>s+(e.amount||0),0);const rev=all('payments').filter(p=>inRange(p.date,R)).reduce((s,p)=>s+(p.amount||0),0);
  const byC={};rows.forEach(e=>byC[e.category||'Khác']=(byC[e.category||'Khác']||0)+(e.amount||0));const cr=Object.entries(byC).sort((a,b)=>b[1]-a[1]);const cm=Math.max(1,...cr.map(x=>x[1]));
  const filters=chipsRow('exp-r',R,[['month','Tháng này'],['prev','Tháng trước'],['7','7 ngày'],['all','Tất cả']]);
  return pageHead('exp','Theo dõi chi phí','Ghi lại mọi khoản chi để biết lãi lỗ thực tế của cơ sở')+
   `<div class="tiles"><div class="tile"><span class="v num">${money(rev)}</span><span class="l">Doanh thu trong kỳ</span></div><div class="tile"><span class="v num" style="color:var(--bad)">${money(tot)}</span><span class="l">Tổng chi phí</span></div><div class="tile"><span class="v num" style="color:${rev-tot>=0?'var(--ok)':'var(--bad)'}">${money(rev-tot)}</span><span class="l">Lợi nhuận tạm tính</span></div><div class="tile"><span class="v num">${rows.length}</span><span class="l">Khoản chi</span></div></div>
   <section class="panel"><div class="panel-h accent"><span class="ic">${I('report')}</span><h2>Chi phí theo nhóm</h2></div><div>${cr.length?cr.map(([k,v])=>`<div class="hbar"><span class="name">${esc(k)}</span><span class="track"><i style="width:${Math.round(v/cm*100)}%;background:var(--b-red)"></i></span><span class="val">${money(v)}</span></div>`).join(''):'<div class="empty">Chưa có khoản chi trong kỳ.</div>'}</div></section>`+
   dataTable({key:'exp',title:'Chi phí',exportName:'chi-phi',rows,filters,
    cols:[{l:'Ngày',v:e=>dm(e.date)+'/'+String(e.date).slice(0,4),x:e=>e.date},{l:'Nhóm',v:e=>`<span class="tag">${esc(e.category||'Khác')}</span>`,x:e=>e.category||''},{l:'Nội dung',cls:'wrap',v:e=>`<b>${esc(e.title||'')}</b>`,x:e=>e.title||''},{l:'Người nhận',v:e=>esc(e.payee||'—'),x:e=>e.payee||''},{l:'Hình thức',v:e=>esc(METHODS2[e.method]||'—'),x:e=>METHODS2[e.method]||''},{l:'Số tiền',cls:'r b',v:e=>`<span style="color:var(--bad)">${money(e.amount)}</span>`,x:e=>e.amount||0,s:e=>e.amount||0}],
    foot:r=>`<td colspan="5">Tổng</td><td class="r">${money(r.reduce((s,e)=>s+(e.amount||0),0))}</td>`,
    add:()=>expForm(),edit:id=>expForm(id),del:async id=>del('expenses',id),delName:e=>e.title});
}

/* ---------- REPORTS ---------- */
function periodRange(P){if(P==='today')return [TODAY,TODAY];if(P==='week')return [addDays(TODAY,-6),TODAY];if(P==='month')return [addDays(TODAY,-29),TODAY];if(P==='cm')return [CUR_M+'-01',TODAY];const pm=prevMonth(CUR_M);return [pm+'-01',pm+'-'+pad(daysInMonth(pm))]}
function viewReport(){
  const t=T(),P=S.period,[from,to]=periodRange(P),inR=d=>d&&d>=from&&d<=to;
  const pays=all('payments').filter(p=>inR(p.date)),rev=pays.reduce((s,p)=>s+p.amount,0);
  const exps=all('expenses').filter(e=>inR(e.date)),expT=exps.reduce((s,e)=>s+(e.amount||0),0);
  const appts=all('appointments').filter(a=>inR(a.date)),done=appts.filter(a=>a.status==='done'),noshow=appts.filter(a=>a.status==='noshow');
  const sales=all('sales').filter(s=>inR(s.date));const avg=sales.length?Math.round(sales.reduce((s,x)=>s+(x.total||0),0)/sales.length):0;
  const newC=all('customers').filter(c=>inR(c.createdAt)).length,nsRate=(done.length+noshow.length)?Math.round(noshow.length/(done.length+noshow.length)*100):0;
  const debtTotal=all('sales').reduce((s,x)=>s+Math.max(0,(x.total||0)-(x.paid||0)),0);
  const nd=Math.min(31,daysBetween(from,to)+1),days=[];for(let i=0;i<nd;i++){const d=addDays(to,-(nd-1-i));const v=pays.filter(p=>p.date===d).reduce((s,p)=>s+p.amount,0);days.push({l:nd>7?dm(d):(d===TODAY?'Nay':WD[parseYmd(d).getDay()]),l2:WD[parseYmd(d).getDay()]+' '+dm(d),v,tip:money(v)})}
  const cat={};done.forEach(a=>{const sv=get('services',a.serviceId);cat[catOf(sv)]=(cat[catOf(sv)]||0)+(a.value||(sv&&sv.price)||0)});
  const bySvc={};done.forEach(a=>{bySvc[a.serviceId]=(bySvc[a.serviceId]||0)+1});const svcRows=Object.entries(bySvc).sort((a,b)=>b[1]-a[1]).slice(0,6),svcMax=Math.max(1,...svcRows.map(x=>x[1]));
  const comm={};done.forEach(a=>{const k=a.staffId||'-';comm[k]=comm[k]||{n:0,v:0,c:0};comm[k].n++;comm[k].v+=a.value||0;comm[k].c+=a.commission||0});const commRows=Object.entries(comm).sort((a,b)=>b[1].v-a[1].v),commMax=Math.max(1,...commRows.map(x=>x[1].v));
  const prodS={};sales.forEach(s=>(s.items||[]).filter(i=>i.type==='prod').forEach(i=>{prodS[i.name]=prodS[i.name]||{q:0,v:0};prodS[i.name].q+=i.qty;prodS[i.name].v+=i.qty*i.price}));const prodRows=Object.entries(prodS).sort((a,b)=>b[1].v-a[1].v).slice(0,6),prodMax=Math.max(1,...prodRows.map(x=>x[1].v));
  const byM={};pays.forEach(p=>byM[p.method]=(byM[p.method]||0)+p.amount);
  const src={};all('customers').filter(c=>inR(c.createdAt)).forEach(c=>src[c.source||'Khác']=(src[c.source||'Khác']||0)+1);
  S.reportRows={title:'Báo cáo '+from+' đến '+to,days,rev,expT};
  const hb=(rows,max,f,val,col)=>rows.length?rows.map(r=>`<div class="hbar"><span class="name">${f(r)}</span><span class="track"><i style="width:${Math.round(val(r)/max*100)}%;${col?'background:'+col:''}"></i></span><span class="val">${r.valTxt||''}</span></div>`).join(''):'<div class="empty">Chưa có dữ liệu trong kỳ.</div>';
  const chip=(k,l)=>`<button class="chip" type="button" data-act="period" data-p="${k}" aria-pressed="${P===k}">${l}</button>`;
  return pageHead('report','Báo cáo & phân tích',`Từ ${dm(from)}/${from.slice(0,4)} đến ${dm(to)}/${to.slice(0,4)}`,`<button class="tbtn pdf" type="button" data-act="rep-print">${I('pdf')}PDF</button><button class="tbtn xls" type="button" data-act="rep-xls">${I('xls')}Excel</button>`)+
  `<div class="chips">${chip('today','Hôm nay')}${chip('week','7 ngày')}${chip('month','30 ngày')}${chip('cm','Tháng này')}${chip('pm','Tháng trước')}</div>
  <div class="tiles">${kpi('var(--b-green)','Doanh thu',money(rev),'money','inv')}${kpi('var(--b-red)','Chi phí',money(expT),'exp','exp')}${kpi(rev-expT>=0?'var(--b-blue)':'var(--b-red)','Lợi nhuận',money(rev-expT),'report','exp',rev?`Biên lãi ${Math.round((rev-expT)/rev*100)}%`:'')}${kpi('var(--b-purple)','Giá trị hóa đơn TB',money(avg),'inv','inv',sales.length+' hóa đơn')}
   ${kpi('var(--accent)','Lượt phục vụ xong',done.length,'today','appts')}${kpi('var(--b-cyan)',t.customer+' mới',newC,'crm','customers')}${kpi(nsRate>15?'var(--b-red)':'var(--ink)','Tỷ lệ không đến',nsRate+'%','x','appts',noshow.length+' lượt')}${kpi('var(--warn)','Tổng công nợ',money(debtTotal),'hourglass','inv')}</div>
  <div class="grid2"><section class="panel"><div class="panel-h accent"><span class="ic">${I('report')}</span><h2>Doanh thu theo ngày</h2><span class="count num">${money(rev)}</span></div><div class="chart">${barChartSVG(days,{label:'Doanh thu theo ngày'})}</div><div class="panel-sub" style="padding-top:4px">${Object.entries(METHODS2).map(([k,l])=>`${l}: <b>${money(byM[k]||0)}</b>`).join(' · ')}</div></section>
  <section class="panel"><div class="panel-h accent"><span class="ic">${I('svc')}</span><h2>Doanh thu theo nhóm dịch vụ</h2></div>${donutBlock(cat)}</section></div>
  <div class="grid2e"><section class="panel"><div class="panel-h"><h2>Doanh số & hoa hồng ${t.staff.toLowerCase()}</h2></div><div>${hb(commRows.map(([k,v])=>({k,v,valTxt:money(v.v)})),commMax,r=>`<i class="staff-dot" style="background:${esc(staffOf(r.k).color)}"></i>${esc(r.k==='-'?'Chưa gán':staffOf(r.k).name)} <span class="muted num">· ${r.v.n} lượt · HH ${short(r.v.c)}</span>`,r=>r.v.v)}</div></section>
  <section class="panel"><div class="panel-h"><h2>Dịch vụ làm nhiều nhất</h2></div><div>${hb(svcRows.map(([k,n])=>({k,n,valTxt:n+' lượt'})),svcMax,r=>esc(serviceName(r.k)),r=>r.n)}</div></section>
  <section class="panel"><div class="panel-h"><h2>Sản phẩm bán chạy</h2></div><div>${hb(prodRows.map(([k,v])=>({k,v,valTxt:money(v.v)})),prodMax,r=>`${esc(r.k)} <span class="muted">· ${r.v.q}</span>`,r=>r.v.v,'var(--s3)')}</div></section>
  <section class="panel"><div class="panel-h"><h2>Nguồn ${t.cust} mới</h2></div><div>${(()=>{const r=Object.entries(src).sort((a,b)=>b[1]-a[1]);const m=Math.max(1,...r.map(x=>x[1]));return hb(r.map(([k,n])=>({k,n,valTxt:n+' '+t.cust})),m,x=>esc(x.k),x=>x.n,'var(--s1)')})()}</div></section></div>`;
}
function reportExport(kind){
  const r=S.reportRows;if(!r)return;
  const head=['Ngày','Doanh thu'],data=r.days.map(d=>[d.l2,d.v]);data.push(['Tổng doanh thu',r.rev],['Tổng chi phí',r.expT],['Lợi nhuận',r.rev-r.expT]);
  const t={title:'Bao cao',name:'bao-cao_'+TODAY,head,data};
  if(kind==='xls')exportXlsx(t);else printHTML(`<h1>${esc(settings().name)} – ${esc(r.title)}</h1><table><thead><tr><th>Ngày</th><th>Doanh thu</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x[0])}</td><td>${money(x[1])}</td></tr>`).join('')}</tbody></table>`);
}

/* ---------- PROMOTIONS & MARKETING ---------- */
function promoStatus(p){if(p.active===false)return ['Tạm tắt','st-cancelled'];if(p.end&&p.end<TODAY)return ['Hết hạn','st-noshow'];if(p.start&&p.start>TODAY)return ['Sắp chạy','st-confirmed'];return ['Đang chạy','st-done']}
function promoForm(id){
  const p=id?get('promos',id):{type:'pct',value:10,start:TODAY,end:addDays(TODAY,30),active:true};
  formSheet({title:id?'Sửa khuyến mãi':'Tạo mã khuyến mãi',data:p,
    fields:[{k:'code',l:'Mã (khách nhập khi thanh toán)',req:1,ph:'VD: THANG10',row:'a'},{k:'name',l:'Tên chương trình',req:1,ph:'VD: Ưu đãi tháng 10',row:'a'},{k:'type',l:'Loại giảm',type:'select',opts:[['pct','Giảm theo %'],['amount','Giảm số tiền']],row:'b'},{k:'value',l:'Mức giảm',type:'number',req:1,row:'b'},{k:'minSpend',l:'Hóa đơn tối thiểu (đ)',type:'money'},{k:'start',l:'Từ ngày',type:'date',row:'c'},{k:'end',l:'Đến ngày',type:'date',row:'c'},{k:'desc',l:'Mô tả',type:'textarea',rows:2},{k:'active',l:'Đang bật',type:'check'}],
    onSave:async v=>{v.code=String(v.code).toUpperCase().replace(/\s/g,'');if(all('promos').some(x=>x.code===v.code&&x.id!==id)){toast('Mã này đã tồn tại.');return false}if(v.type==='pct'&&v.value>100){toast('Giảm tối đa 100%.');return false}await put('promos',id||uid(),{...p,...v});toast('Đã lưu khuyến mãi '+v.code)}});
}
const SEGS=[['bday','Sinh nhật tháng này'],['away','Lâu chưa quay lại (45+ ngày)'],['course','Đang có liệu trình'],['vip','Khách VIP'],['new','Khách mới 30 ngày'],['debt','Còn nợ'],['all','Tất cả']];
function segCustomers(k){const d=derive(),cs=all('customers').filter(c=>c.phone);
  if(k==='bday')return cs.filter(c=>c.birthday&&c.birthday.slice(5,7)===TODAY.slice(5,7));
  if(k==='away')return cs.filter(c=>d.last[c.id]&&daysBetween(d.last[c.id].date,TODAY)>=45&&!d.future[c.id]);
  if(k==='course')return cs.filter(c=>d.activeCourse[c.id]);if(k==='vip')return cs.filter(c=>/vip/i.test(c.tags||''));
  if(k==='new')return cs.filter(c=>c.createdAt&&daysBetween(c.createdAt,TODAY)<=30);if(k==='debt')return cs.filter(c=>d.debt[c.id]>0);return cs}

  }

}

/* ---------- SETTINGS ---------- */
function readImage(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function viewSettings(){
  const st=settings(),t=T(),acc=st.accent||(()=>{try{return localStorage.getItem('vua-accent')}catch(e){return ''}})()||'rose',th=st.theme||(()=>{try{return localStorage.getItem('vua-theme')}catch(e){return ''}})()||'auto';
  const card=(band,icon,title,body)=>`<section class="card"><div class="card-h" style="--band:${band}">${I(icon)}${title}</div><div class="card-b">${body}</div></section>`;
  const fr=(id,l,v,extra)=>`<div class="frow"><label for="${id}">${l}</label><input class="input" id="${id}" value="${esc(v??'')}" ${extra||''}></div>`;
  let h=pageHead('settings','Cài đặt & giao diện','Thông tin cơ sở, tài chính, giao diện, nhân sự và dữ liệu');
  h+=card('var(--accent)','building','Thông tin '+t.org.toLowerCase(),`<form class="form" id="set-info">${fr('si-name','Tên '+t.org.toLowerCase(),st.name)}${fr('si-owner','Tên chủ / quản lý',st.owner)}${fr('si-phone','Hotline',st.phone,'inputmode="tel"')}${fr('si-addr','Địa chỉ',st.address)}

function bindSettings(){
